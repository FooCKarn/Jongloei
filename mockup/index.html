<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>JongLoei App Mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone-sized app on the right, a clickable user-flow index on the left (stacks on phones). */
:root{
  --brand:#A00018;          /* logo crimson, fixed in both themes */
  --red:#A00018;            /* interactive accent */
  --red-strong:#7E0013;
  --red-soft:#FBEBED;       /* tinted fills */
  --bg:#F6F3F3;             /* page ground, red-biased neutral */
  --surface:#FFFFFF;
  --surface-2:#FAF7F7;
  --ink:#1E1416;
  --muted:#6E6265;
  --line:#ECE4E5;
  --ok:#1D7A48; --ok-soft:#E5F3EB;
  --warn:#9A5B00; --warn-soft:#FBF0DD;
  --qr-bg:#FFFFFF; --qr-ink:#1E1416;
  --shadow:0 1px 2px rgba(60,10,16,.06),0 8px 24px rgba(60,10,16,.08);
  --f-display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Prompt",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --red:#E8485A;--red-strong:#FF6B7B;--red-soft:#3A1519;--bg:#120C0D;--surface:#1C1415;--surface-2:#241A1C;
  --ink:#F5ECED;--muted:#B3A3A6;--line:#35282A;--ok:#5CC98C;--ok-soft:#163223;--warn:#F0B35A;--warn-soft:#352612;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#E8485A;--red-strong:#FF6B7B;--red-soft:#3A1519;--bg:#120C0D;--surface:#1C1415;--surface-2:#241A1C;
  --ink:#F5ECED;--muted:#B3A3A6;--line:#35282A;--ok:#5CC98C;--ok-soft:#163223;--warn:#F0B35A;--warn-soft:#352612;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.stage{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:40px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}.stage .devwrap{order:-1;position:relative;top:auto}.stage .device{height:min(780px,calc(100dvh - 32px))}}

/* ---------- flow index ---------- */
.intro{display:flex;flex-direction:column;gap:20px;padding-top:8px;min-width:0}
.brandrow{display:flex;align-items:center;gap:14px}
.brandrow svg{width:52px;height:52px;flex:none}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.06em;color:var(--red)}
.intro p{margin:0;color:var(--muted);max-width:56ch}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;counter-reset:f}
.flow button{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:none}
.flow button:hover{background:var(--surface)}
.flow button.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.flow .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:13px;background:var(--red-soft);color:var(--red)}
.flow button.on .n{background:var(--red);color:#fff}
.flow b{display:block;font-weight:600}
.flow small{color:var(--muted);font-size:13px}
.legend{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* ---------- device ---------- */
.device{position:relative;width:100%;max-width:400px;margin:0 auto;height:min(820px,calc(100dvh - 48px));min-height:620px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:36px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.appbar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.appbar .ttl{flex:1;font-family:var(--f-display);font-weight:600;font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar svg.logo{width:30px;height:30px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.walletchip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--red-soft);color:var(--red);font-size:12px;font-weight:600;border:0}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.screen{padding:16px 18px 24px;display:flex;flex-direction:column;gap:16px;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);flex:none;padding-bottom:6px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 4px;font-size:11.5px;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--red);font-weight:600}

/* ---------- shared bits ---------- */
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;font-family:var(--f-display);font-size:16px;background:var(--red);color:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--red-strong)}
.btn.ghost{background:var(--surface);color:var(--red);border:1.5px solid var(--red)}
.btn.ghost:hover{background:var(--red-soft)}
.btn.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--red-soft);color:var(--red);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.grey{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--muted)}
.search svg{width:18px;height:18px}
.search input{border:0;background:none;outline:none;flex:1;font:inherit;color:var(--ink);min-width:0}
hr.sep{border:0;border-top:1px dashed var(--line);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}

/* posters: typographic, no photos */
.poster{border-radius:16px;position:relative;overflow:hidden;color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;min-height:140px;isolation:isolate}
.poster::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--pbg)}
.poster::after{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 2px,transparent 2px 14px)}
.poster .ptag{position:absolute;top:12px;left:12px;font-size:11px;font-weight:600;letter-spacing:.06em;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:999px}
.poster .pbig{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1;letter-spacing:.01em}
.poster.lg{min-height:200px}.poster.lg .pbig{font-size:28px}

.evlist{display:flex;flex-direction:column;gap:12px}
.ev{display:grid;grid-template-columns:92px 1fr;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;width:100%}
.ev .poster{min-height:92px;padding:8px;border-radius:12px}
.ev .poster .pbig{font-size:13px}
.ev h3{font-size:15.5px;font-weight:600}
.ev .meta{font-size:13px;color:var(--muted)}
.ev .price{font-family:var(--f-display);font-weight:600;color:var(--red)}
.ev>div{min-width:0;display:flex;flex-direction:column;gap:3px}

.zones{display:flex;flex-direction:column;gap:8px}
.zone{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.zone .dot{width:12px;height:12px;border-radius:4px;background:var(--zc)}
.zone.on{border-color:var(--red);background:var(--red-soft)}
.zone b{font-family:var(--f-display);font-weight:600}
.zone[disabled]{opacity:.5}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}

.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trust div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12.5px;line-height:1.35}
.trust svg{width:20px;height:20px;color:var(--red);display:block;margin-bottom:4px}

.sticky-cta{position:sticky;bottom:0;background:linear-gradient(to top,var(--surface-2) 85%,transparent);padding:14px 18px 16px;margin:0 -18px -24px;display:flex;gap:10px;align-items:center}
.sticky-cta .tot{flex:none;display:flex;flex-direction:column;line-height:1.2}
.sticky-cta .tot b{font-family:var(--f-display);font-size:20px}

.pay{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.pay.on{border-color:var(--red)}
.pay .logo{width:40px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:#113566}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.pay.on .radio{border:6px solid var(--red)}

.qrbox{background:var(--qr-bg);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;border:1px solid var(--line);color:#1E1416}
.qrbox canvas{width:220px;height:220px;max-width:100%;image-rendering:pixelated}
.tqr{width:100%;background:#113566;color:#fff;border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;padding-bottom:18px;position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::before{background:var(--red)}
.steps .s{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.steps .s svg{width:16px;height:16px}
.steps li.done .s{background:var(--red);border-color:var(--red);color:#fff}
.steps li.active .s{border-color:var(--red)}
.steps li.active .s::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--red);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steps b{display:block;font-weight:600}
.steps small{color:var(--muted);font-size:13px}

/* NFT ticket card */
.nft{border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.nft .poster{border-radius:0;min-height:150px}
.nft .stub{position:relative;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.nft .stub::before,.nft .stub::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.nft .stub::before{left:-12px}.nft .stub::after{right:-12px}
.nft .perf{position:absolute;top:0;left:16px;right:16px;border-top:2px dashed var(--line)}
.tokenid{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--red)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--red);color:#fff}

.ring{display:flex;align-items:center;gap:8px;font-size:13px;color:#6E6265}
.ring svg{width:22px;height:22px;transform:rotate(-90deg)}

.mticket{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.mticket .poster{min-height:70px;padding:6px;border-radius:10px}
.mticket .poster .pbig{font-size:11px}
.mticket>div{min-width:0}
.mticket h3{font-size:15px;font-weight:600}

.listing{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.listing .top{display:grid;grid-template-columns:64px 1fr;gap:12px}
.listing .poster{min-height:64px;padding:6px;border-radius:10px}.listing .poster .pbig{font-size:10px}
.listing .top>div{min-width:0}
.strike{text-decoration:line-through;color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--red);border-radius:99px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font:inherit;color:var(--ink);width:100%}
.field input:focus{border-color:var(--red);outline:none}
.hint{font-size:12.5px;color:var(--muted)}
.hint.err{color:var(--red)}

.sheet-wrap{position:absolute;inset:0;background:rgba(20,6,8,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:10px 18px 22px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto}
.social{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px;font-weight:600;width:100%}
.social .g{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.linkbtn{border:0;background:none;color:var(--red);font-weight:600;padding:0;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

.toast{position:absolute;left:18px;right:18px;bottom:76px;background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;z-index:9;display:flex;gap:8px;align-items:center;animation:up .2s ease}
.hero-ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:6px}
.hero-ok .big{width:64px;height:64px;border-radius:20px;background:var(--red);color:#fff;display:grid;place-items:center}
.hero-ok .big svg{width:34px;height:34px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.wallet-addr{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wallet-addr .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adv{border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.devwrap{position:sticky;top:max(16px,env(safe-area-inset-top,0px));min-width:0}
.mode{display:inline-grid;grid-template-columns:1fr 1fr;width:max-content;max-width:100%}
.cols,.col,.narrow{display:flex;flex-direction:column;gap:16px;min-width:0}
.ev.feature{grid-template-columns:1fr;padding:0;overflow:hidden}
.d-only{display:none!important}
.browserbar{display:none}
.sgrid{display:grid;gap:16px;grid-template-areas:"hero" "nft" "btns";grid-template-columns:minmax(0,1fr)}
.sgrid .a-hero{grid-area:hero}.sgrid .a-nft{grid-area:nft;min-width:0}.sgrid .a-btns{grid-area:btns;display:flex;flex-direction:column;gap:12px}
.tgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.stage:not(.desk) .tv-hide{display:none}
.tlist,.lgrid{display:flex;flex-direction:column;gap:12px}
.backrow{display:flex;align-items:center;gap:12px}

/* ---------- desktop web mode ---------- */
.stage.desk{grid-template-columns:minmax(0,1fr);max-width:1280px;gap:18px}
.stage.desk .intro{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:0}
.stage.desk .intro>p,.stage.desk .legend{display:none}
.stage.desk .brandrow svg{width:36px;height:36px}.stage.desk .wordmark{font-size:20px}
.stage.desk .mode{margin-left:auto}
.stage.desk .flow{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3;gap:6px;padding-bottom:4px}
.stage.desk .flow li{flex:none}
.stage.desk .flow button{grid-template-columns:24px auto;align-items:center;padding:5px 12px 5px 5px;border-color:var(--line);background:var(--surface);border-radius:999px;gap:8px;box-shadow:none}
.stage.desk .flow button.on{border-color:var(--red)}
.stage.desk .flow small{display:none}.stage.desk .flow b{font-size:13.5px;white-space:nowrap}
.stage.desk .flow .n{width:24px;height:24px;font-size:12px}
.stage.desk .devwrap{position:static;overflow-x:auto;border-radius:14px}
.stage.desk .device{max-width:none;min-width:1000px;border-radius:14px;height:min(860px,calc(100dvh - 150px));min-height:640px}
.stage.desk .browserbar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);flex:none}
.browserbar i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.browserbar .url{flex:0 1 420px;margin-left:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 12px;font-size:12.5px;color:var(--muted)}
.stage.desk .tabbar{display:none}
.stage.desk .appbar{padding:12px 32px;gap:18px}
.stage.desk .d-only{display:flex!important}
.stage.desk .m-only{display:none}
.dnav{gap:4px}
.dnav button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--muted)}
.dnav button:hover{background:var(--surface-2);color:var(--ink)}
.dnav button.on{color:var(--red);background:var(--red-soft)}
.dsearch.search{flex:1;max-width:340px;margin-left:auto;padding:8px 12px}
.avatar{width:36px;height:36px;border-radius:12px;border:0;background:var(--red);color:#fff;font-family:var(--f-display);font-weight:600;flex:none}
.stage.desk .screen{max-width:1140px;margin:0 auto;width:100%;padding:28px 32px 48px;gap:24px}
.stage.desk .ev.feature{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.stage.desk .feature .poster{min-height:300px;border-radius:0}
.stage.desk .feature .poster .pbig{font-size:52px}
.stage.desk .feature .finfo{padding:28px!important;display:flex;flex-direction:column;justify-content:center;gap:10px}

// keeps the screen stack inside the current mode and the organizer role's allowed screens
function guardMode(){
  const cur=S.stack[S.stack.length-1],isOrg=cur.startsWith('org');
  const reset=(s,tab)=>{S.stack=[s];S.tab=tab||s};
  if(S.mode!=='org'){if(isOrg)reset('home');return}
  // organizer sign-in is its own state: no account -> log-in screen, account without a shop -> onboarding
  if(!S.org.account){if(cur!=='orgWelcome')reset('orgWelcome','orgDash');return}
  if(!S.org.shop){if(cur!=='orgOnboard')reset('orgOnboard','orgDash');return}
  if(!isOrg||cur==='orgWelcome'||cur==='orgOnboard')return reset(S.org.role==='gate'?'orgGatePick':'orgDash');
  if(S.org.role==='gate'&&!['orgGatePick','orgGate'].includes(cur))return reset('orgGatePick');
  if(S.org.role!=='owner'&&['orgFinance','orgTeam'].includes(cur))return reset('orgDash');
}

function render(){
  guardMode();
  const cur=S.stack[S.stack.length-1];
  const tabs=S.mode==='org'?orgTabsFor(S.org.role):BUYER_TABS;
  $('#tabbar').style.gridTemplateColumns=`repeat(${tabs.length},1fr)`;
  $('#tabbar').innerHTML=tabs.map(([k,icon,label])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}"><svg><use href="#${icon}"/></svg>${label}</button>`).join('');
  const fullFlow=['checkout','pay','minting','orgWizard','orgOnboard','orgWelcome'].includes(cur);
  $('#tabbar').hidden=fullFlow;
  let html=(VIEWS[cur]||VIEWS.home)();
  if(S.desk&&S.stack.length>1)html=`<div class="backrow"><button class="iconbtn" data-act="back" aria-label="ย้อนกลับ"><svg><use href="#i-back"/></svg></button><h2 style="font-size:20px">${S.title}</h2></div>`+html;
  $('#scroll').innerHTML=`<div class="screen">${html}</div>`;
  $('#scroll').scrollTop=0;
  (AFTER[cur]||(()=>{}))();
  if(S.focus){const el=document.getElementById(S.focus);if(el){el.focus();const n=el.value.length;try{el.setSelectionRange(n,n)}catch(_){}}S.focus=null}
  save();
}

// 14-day column chart: one series, so no legend box; value labelled on the peak only, full values in tooltip + table
function orgChart(days){
  const W=560,H=180,pl=34,pb=26,pt=14,max=Math.max(1,...days.map(d=>d.count));
  const top=max<=4?4:Math.ceil(max/4)*4,plotH=H-pb-pt,slot=(W-pl-8)/days.length,bw=Math.min(24,slot-8);
  const y=v=>pt+plotH-(v/top)*plotH;
  const dl=d=>{const x=new Date(d*DAY);return x.getUTCDate()+'/'+(x.getUTCMonth()+1)};
  const ticks=[0,top/2,top].map(v=>`<line x1="${pl}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('');
  const peak=days.reduce((m,d,i)=>d.count>days[m].count?i:m,0);
  const bars=days.map((d,i)=>{
    const x=pl+i*slot+(slot-bw)/2,h=Math.max(d.count?4:0,(d.count/top)*plotH),yy=pt+plotH-h,r=Math.min(4,h);
    const path=d.count?`M${x},${yy+h}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${yy+h}Z`:'';
    return `<g><rect x="${pl+i*slot}" y="${pt}" width="${slot}" height="${plotH+pb}" fill="transparent" data-bar data-i="${i}" data-count="${d.count}" data-amount="${d.amount}" data-label="${dl(d.day)}" tabindex="0" role="img" aria-label="${dl(d.day)}: ${d.count} ใบ"/>
      ${path?`<path d="${path}" fill="var(--red)" pointer-events="none"/>`:''}
      ${i%2===(days.length-1)%2?`<text x="${pl+i*slot+slot/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${dl(d.day)}</text>`:''}
      ${i===peak&&d.count?`<text x="${pl+i*slot+slot/2}" y="${yy-5}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${d.count}</text>`:''}</g>`;
  }).join('');
  return `<div id="org-chart" class="org-chart" style="position:relative"><svg viewBox="0 0 ${W} ${H}" width="100%" role="group" aria-label="กราฟแท่งตั๋วที่ขายได้ต่อวัน 14 วันล่าสุด">${ticks}<line x1="${pl}" x2="${W-8}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>${bars}</svg>
    <div id="org-tip" class="org-tip" role="status" hidden></div>
    <details class="small" style="margin-top:6px"><summary>ดูเป็นตาราง</summary>
      <table id="org-chart-table" class="org-table"><thead><tr><th scope="col">วันที่</th><th scope="col">ตั๋ว (ใบ)</th><th scope="col">ยอดขาย</th></tr></thead>
      <tbody>${days.map(d=>`<tr><th scope="row">${dl(d.day)}</th><td class="num">${d.count}</td><td class="num">${OL.fmtBaht(d.amount)}</td></tr>`).join('')}</tbody></table></details></div>`;
}

// form field with a label, an error slot wired by aria-describedby and an optional hint
function fld(id,label,o={}){
  const {value='',type='text',hint='',err='',attrs='',options=null,tag='input'}=o;
  const desc=`${id}-err`+(hint?` ${id}-hint`:'');
  const common=`id="${id}" aria-describedby="${desc}" ${err?'aria-invalid="true"':''} ${attrs}`;
  const control=options?`<select ${common}>${options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`).join('')}</select>`
    :tag==='textarea'?`<textarea ${common} rows="4">${esc(value)}</textarea>`
    :`<input ${common} type="${type}" value="${esc(value)}">`;
  return `<div class="field"><label for="${id}">${label}</label>${control}
    ${hint?`<span class="hint" id="${id}-hint">${hint}</span>`:''}<span class="hint err" id="${id}-err" role="alert">${esc(err)}</span></div>`;
}

function wizErrors(){

}

const ZERR_FIELD={name:'name',price:'price',capacity:'cap',seatsPerUnit:'seats',saleStartAt:'open',saleEndAt:'close'};

function zoneTotals(d){

  for(const z of d.zones){const c=Number.isInteger(z.capacity)?z.capacity:0,p=Number.isInteger(z.price)?z.price:0;
    cap+=c;if(z.kind!=='comp'){rev+=p*c;fees+=OL.serviceFee(p)*(p>0?c:0)}}

}

// cancel an event: one refund per paid hop, safe to run again (idempotency keys), buyer tickets follow
function orgCancelEvent(id,reason){
  const o=S.org,ev=orgEv(id);
  if(!ev||ev.status==='cancelled'||ev.status==='ended'||ev.status==='draft')return {refunded:0,total:0,refunds:[]};
  const done=new Set(o.ledger.filter(l=>l.type==='REFUND_OUT').map(l=>l.idempotencyKey));
  const plan=OL.planCancellation(ev,o.tickets,done);
  for(const r of plan.refunds)ledgerAdd({type:'REFUND_OUT',eventId:id,ticketId:r.ticketId,amount:r.amount,party:r.payerId,idempotencyKey:r.key});
  for(const t of o.tickets)if(t.eventId===id&&t.hops.some(h=>h.paid>0))t.status='refunded';
  replaceOrgEvent({...ev,status:'cancelled',cancelReason:reason||''});
  S.listings=S.listings.filter(l=>l.ev!==id);
  for(const bt of S.tickets){
    if(bt.ev!==id)continue;
    const mine=plan.refunds.filter(r=>r.ticketId===bt.orgTicketId&&r.payerId==='me').reduce((a,r)=>a+r.amount,0);
    bt.status='refunded';bt.refundAmount=mine/100;
  }
  save();
  return {...plan,refunded:plan.refunds.length};
}

// one door decision: ask checkinResult, write the log, and on success mark the ticket used on both sides
function gateRun(ev,ticket,signerId,ts,method){
  const now=Date.now(),r=OL.checkinResult({ticket,event:ev,signerId,ts,now});
  S.org.checkinLog.unshift({at:now,ticketId:ticket?ticket.ticketId:'—',eventId:ev.id,valid:r.valid,reason:r.reason||null,method,by:gateWho()});
  S.org.checkinLog.length=Math.min(S.org.checkinLog.length,50);
  if(r.valid){
    ticket.status='used';ticket.usedAt=now;ticket.checkinMethod=method;
    S.listings=S.listings.filter(l=>l.orgTicketId!==ticket.ticketId);          // checking in cancels a resale listing (context.md 5.2)
    for(const bt of S.tickets)if(bt.orgTicketId===ticket.ticketId)bt.status='used';
  }
  return r;
}

function simCase(c){
  const e=orgEv(S.org.oev),T=evTickets(e.id),now=Date.now();
  const pick=pred=>T.find(pred),other=S.org.tickets.find(t=>t.eventId!==e.id),cx=S.org.events.find(x=>x.status==='cancelled');
  // plain single-owner ticket for the happy path, so the resold ticket stays available for the old-owner case
  const v=pick(t=>t.status==='valid'&&t.hops.length===1)||pick(t=>t.status==='valid'),dc={
    1:()=>v&&[e,v,v.holderId,now-3000],
    2:()=>{const u=pick(t=>t.status==='used');return u&&[e,u,u.holderId,now-3000]},
    3:()=>v&&[e,v,v.holderId,now-61000],
    4:()=>v&&[e,v,v.holderId,now+16000],
    5:()=>other&&[e,other,other.holderId,now-3000],
    6:()=>{const t=cx&&S.org.tickets.find(x=>x.eventId===cx.id);return t&&[cx,t,t.holderId,now-3000]},
    7:()=>{const t=pick(x=>x.status==='valid'&&x.hops.length>1);return t&&[e,t,t.hops[0].payerId,now-3000]},
    8:()=>{const t=pick(x=>x.status==='listed');return t&&[e,t,t.holderId,now-3000]},
  };
  return dc[c]();
}

function finishMint(){
  let t;
  if(S.buyingListing){
    const L=S.buyingListing;S.listings=S.listings.filter(x=>x.lid!==L.lid);
    t={tid:L.tid,ev:L.ev,zone:L.zone,price:L.face,status:'active',transfers:L.transfers+1,tx:'0x'+rand(4)+'…'+rand(4),orgTicketId:L.orgTicketId};
    const ot=L.orgTicketId&&S.org.tickets.find(x=>x.ticketId===L.orgTicketId);
    if(ot){const paid=L.price*100;ot.hops.push({idx:ot.hops.length,payerId:'me',paid,at:Date.now()});ot.holderId='me';ot.status='valid';
      ledgerAdd({type:'PAYMENT_IN',eventId:ot.eventId,ticketId:ot.ticketId,amount:paid,party:'me',idempotencyKey:'in:'+ot.ticketId+':'+(ot.hops.length-1)})}
    S.tickets.unshift(t);S.buyingListing=null;
  }else{
    const e=evById(S.ev);const z=e.zones[S.zone];
    let sold=null;
    if(isLocal(e.id)){
      const r=OL.recordPrimarySale(orgEv(e.id),z.zoneId,S.qty,'me',S.tickets.filter(x=>x.ev===e.id).length,Date.now());
      if(!r.ok){toast({sold_out:'ที่นั่งโซนนี้ไม่พอแล้ว',over_limit:'ซื้อได้ไม่เกิน 4 ใบต่อบัญชี',not_on_sale:'งานนี้ปิดรับชั่วคราว',invalid_qty:'จำนวนตั๋วไม่ถูกต้อง'}[r.reason]);S.stack=['home','event'];S.tab='home';render();return}
      if(S.promo&&S.promo.ev===e.id)for(const ot of r.tickets){const res=OL.applyPromo(S.promo.code,S.org.promos,ot.zoneId,ot.hops[0].paid,Date.now());
        if(res.ok){ot.hops[0].paid=res.price;const p=S.org.promos.find(x=>x.code===S.promo.code);if(p)p.used=(p.used||0)+1}}
      S.promo=null;
      replaceOrgEvent(r.event);S.org.tickets.push(...r.tickets);sold=r.tickets;
      for(const ot of r.tickets)if(ot.hops[0].paid>0)ledgerAdd({type:'PAYMENT_IN',eventId:e.id,ticketId:ot.ticketId,amount:ot.hops[0].paid,party:'me',idempotencyKey:'in:'+ot.ticketId+':0'});
    }else z.left=Math.max(0,z.left-S.qty);
    for(let k=0;k<S.qty;k++){t={tid:S.nextTid++,ev:e.id,zone:z.z,price:z.p,status:'active',transfers:0,tx:'0x'+rand(4)+'…'+rand(4),orgTicketId:sold?sold[k].ticketId:undefined};S.tickets.unshift(t)}
    t=S.tickets[S.qty-1];
  }
  S.sel=t;S.stack=['tickets'];S.tab='tickets';S.mtab='active';go('success');
}
function rand(n){return Array.from({length:n},()=>'0123456789abcdef'[Math.random()*16|0]).join('')}

/* ---------- pseudo QR ---------- */
function drawQR(c,seed){
  if(!c)return;const N=29,ctx=c.getContext('2d');
  let h=2166136261;for(const ch of seed){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}
  const rnd=()=>{h|=0;h=h+0x6D2B79F5|0;let t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  ctx.fillStyle='#fff';ctx.fillRect(0,0,N,N);ctx.fillStyle='#1E1416';
  const inFinder=(x,y)=>[[0,0],[N-7,0],[0,N-7]].some(([fx,fy])=>x>=fx-1&&x<=fx+7&&y>=fy-1&&y<=fy+7);
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(!inFinder(x,y)&&rnd()<.48)ctx.fillRect(x,y,1,1);
  [[1,1],[N-8,1],[1,N-8]].forEach(([x,y])=>{ctx.fillRect(x,y,7,7);ctx.fillStyle='#fff';ctx.fillRect(x+1,y+1,5,5);ctx.fillStyle='#1E1416';ctx.fillRect(x+2,y+2,3,3)});
  ctx.fillStyle='#A00018';ctx.fillRect(13,13,3,3);
}

/* ---------- sheets ---------- */
const FOCUSABLE='button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';
let sheetOpener=null;
function sheet(html){
  // remember what opened the first sheet so focus can go back there (a sheet opened from inside a sheet keeps the original opener)
  const opener=$('#sheet')&&sheetOpener?sheetOpener:document.activeElement;
  closeSheet(true);sheetOpener=opener&&opener!==document.body?opener:null;
  const w=document.createElement('div');w.className='sheet-wrap';w.id='sheet';
  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grab"></div>${html}</div>`;
  w.addEventListener('click',ev=>{if(ev.target===w)closeSheet()});$('#scroll').appendChild(w);$('#scroll').scrollTop=0;$('#scroll').style.overflow='hidden';
  const first=w.querySelector('.sheet '+FOCUSABLE.split(',').join(',.sheet '));(first||w.querySelector('.sheet')).focus();
}
function closeSheet(keepOpener){
  const s=$('#sheet');if(s)s.remove();$('#scroll').style.overflow='';
  if(!keepOpener){if(sheetOpener&&sheetOpener.isConnected)sheetOpener.focus();sheetOpener=null}
}
// keep Tab inside an open sheet
document.addEventListener('keydown',e=>{
  if(e.key!=='Tab')return;const s=$('#sheet');if(!s)return;
  const f=[...s.querySelectorAll(FOCUSABLE)];if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(!s.contains(document.activeElement)){e.preventDefault();first.focus()}
  else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});

  <div class="card small" style="display:flex;flex-direction:column;gap:4px"><b>Token #${t.tid} · ${evById(t.ev).name}</b><span class="muted">โอนแล้ว ${t.transfers}/2 ครั้ง · หลังโอน QR เดิมของคุณจะใช้ไม่ได้ทันที</span></div>
  <button class="btn" data-act="dotransfer">ยืนยันการโอน</button><button class="btn plain" data-act="close">ยกเลิก</button>`);
}
function toast(msg){const old=$('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');
  d.innerHTML=`<svg width="18" height="18" style="flex:none"><use href="#i-check"/></svg>${msg}`;$('#device').appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ---------- actions ---------- */
$('#device').addEventListener('click',e=>{
  const t=e.target;let b;
  if(b=t.closest('[data-o]')){orgAct(b.dataset.o,b,e);return}
  if(b=t.closest('[data-ev]')){S.ev=b.dataset.ev;S.promo=null;S.zone=Math.max(0,evById(S.ev).zones.findIndex(z=>z.left>0));S.qty=1;go('event');return}
  if(b=t.closest('[data-cat]')){S.cat=b.dataset.cat;render();return}
  if(b=t.closest('[data-mcat]')){S.mcat=b.dataset.mcat;render();return}
  if(b=t.closest('[data-zone]')){S.zone=+b.dataset.zone;render();return}
  if(b=t.closest('[data-q]')){{const cap=4-S.tickets.filter(x=>x.ev===S.ev).length;S.qty=Math.min(Math.max(1,cap),Math.max(1,S.qty+ +b.dataset.q))}render();return}
  if(b=t.closest('[data-pay]')){S.pay=b.dataset.pay;render();return}
  if(b=t.closest('[data-mtab]')){S.mtab=b.dataset.mtab;render();return}
  if(b=t.closest('[data-ticket]')){S.sel=S.tickets.find(x=>x.tid==b.dataset.ticket);S.ticketView='qr';go('ticket');return}
  if(b=t.closest('[data-tv]')){S.ticketView=b.dataset.tv;stopTimers();render();return}
  if(b=t.closest('[data-buyl]')){S.buyingListing=S.listings.find(l=>l.lid==b.dataset.buyl);if(!S.signedIn){openSignup('checkout');return}go('checkout');return}
  if(!(b=t.closest('[data-act]'))||b.closest('#appbar'))return;
  const a=b.dataset.act;
  switch(a){
    case 'buy':S.buyingListing=null;if(!S.signedIn){openSignup('checkout');return}go('checkout');break;
    case 'topay':if(isLocal(S.buyingListing?S.buyingListing.ev:S.ev))go('pay');else startStripeCheckout();break;
    case 'paid':if(isLocal(S.buyingListing?S.buyingListing.ev:S.ev))go('minting');else startStripeCheckout();break;
    case 'orgmode':enterOrg();break;
    case 'back':back();break;
    case 'home':go('home',true);break;
    case 'viewticket':S.ticketView='qr';go('ticket');break;
    case 'tickets':go('tickets',true);break;
    case 'signup':openSignup();break;
    case 'google':if(S.auth.google){googleLogin();return}walletCreating();break;
    case 'otp':if(S.auth.google){toast('เข้าสู่ระบบด้วยอีเมลจะเปิดให้ใช้เร็วๆ นี้ ใช้ Google ไปก่อนได้เลย');return}walletCreating();break;
    case 'signedin':closeSheet();toast('สร้างกระเป๋าตั๋วเรียบร้อย');if(S.afterSignup){const n=S.afterSignup;S.afterSignup=null;resumeAfter(n);}else render();break;
    case 'resell':openResell();break;
    case 'transfer':openTransfer();break;
    case 'close':closeSheet();break;
    case 'list':{const v=+$('#rprice').value;const tk=S.sel;tk.status='listed';tk.listPrice=v;orgTicketStatus(tk,'listed');
      S.listings.unshift({lid:Date.now(),ev:tk.ev,zone:tk.zone,face:tk.price,price:v,seller:short(S.user.wallet),transfers:tk.transfers,tid:tk.tid,orgTicketId:tk.orgTicketId});
      closeSheet();toast('ลงขายแล้ว ดูได้ในตลาดรีเซล');render();break}
    case 'unlist':{const tk=S.sel;tk.status='active';orgTicketStatus(tk,'valid');S.listings=S.listings.filter(l=>l.tid!==tk.tid);toast('ยกเลิกการลงขายแล้ว');render();break}
    case 'dotransfer':{const to=$('#tto').value.trim();if(!to){$('#tto').focus();return}
      S.tickets=S.tickets.filter(x=>x!==S.sel);closeSheet();toast('โอน Token #'+S.sel.tid+' ให้ '+to+' แล้ว');go('tickets',true);break}
    case 'scan':{S.sel.status='used';orgTicketStatus(S.sel,'used');stopTimers();toast('สแกนผ่าน เข้างานได้ ตั๋วถูกล็อกแล้ว');render();break}
    case 'copy':{const w=S.user.wallet;try{navigator.clipboard.writeText(w).then(()=>toast('คัดลอกที่อยู่ wallet แล้ว'),()=>toast('คัดลอกไม่ได้ ลองเลือกข้อความแทน'))}catch(_){toast('คัดลอกไม่ได้ ลองเลือกข้อความแทน')}break}
    case 'toast':toast(b.dataset.msg);break;
    case 'gomarket':S.mcat=S.ev;go('market',true);break;
    case 'clearq':S.q='';S.cat='ทั้งหมด';render();break;
    case 'newqr':render();break;
    case 'reset':try{localStorage.removeItem(KEY)}catch(_){}location.reload();break;
    case 'logout':if(S.auth.google)fetch('/auth/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});S.signedIn=false;save();go('home',true);break;
  }
});

/* layout follows the screen width */
function applyMode(){S.desk=window.innerWidth>=900;$('#stage').classList.toggle('desk',S.desk)}
window.addEventListener('resize',()=>{const was=S.desk;applyMode();if(was!==S.desk){closeSheet();stopTimers();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- real Google sign-in (src/worker.js) ----------
   /api/me says whether the Worker has Google secrets. Without them (or when the
   page is opened as a file) the demo login above stays as it is. */
const AUTH_KEY='jongloei-auth-after';
async function startStripeCheckout(){
  if(!/^https?:$/.test(location.protocol)){
    toast('กรุณาเปิดเว็บผ่าน URL ของ Cloudflare Worker ไม่ใช่ไฟล์ในเครื่อง');
    return;
  }
  if(!S.auth.google){
    toast('กรุณาเข้าสู่ระบบ Google ก่อนชำระเงิน');
    openSignup('checkout');
    return;
  }
  const listing=S.buyingListing;
  const eventId=listing?listing.ev:S.ev;
  const zone=listing?listing.zone:evById(S.ev).zones[S.zone].z;
  const quantity=listing?1:S.qty;
  const button=document.querySelector('[data-act="topay"],[data-act="paid"]');
  if(button){button.disabled=true;button.textContent='กำลังเชื่อมต่อ Stripe…'}
  try{
    const response=await fetch('/api/checkout-session',{
      method:'POST',
      credentials:'same-origin',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({eventId,zone,quantity}),
    });
    const data=await readJsonResponse(response,'/api/checkout-session');
    if(!data){
      throw new Error(response.status===404
        ?'ไม่พบ API ของ Worker กรุณา deploy Worker เวอร์ชันล่าสุด'
        :'Worker ส่งข้อมูลไม่ใช่ JSON กรุณาตรวจสอบการ deploy');
    }
    if(!response.ok||!data.url){
      const messages={
        authentication_required:'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่',
        stripe_unconfigured:'ระบบยังไม่ได้ตั้งค่า Stripe Secret Key',
        stripe_request_failed:'Stripe ปฏิเสธคำขอ กรุณาตรวจสอบ API key และบัญชี Stripe',
        payment_storage_unavailable:'ระบบฐานข้อมูลยังไม่พร้อม กรุณา apply migration 0002_payments.sql บน D1',
        event_storage_unavailable:'ระบบรายการอีเวนต์ยังไม่พร้อม กรุณา apply migration 0003_events.sql บน D1',
      };
      throw new Error(messages[data.error]||data.error||'checkout_failed');
    }
    location.href=data.url;
  }catch(err){
    console.error('Stripe checkout failed',err);
    if(button){button.disabled=false;button.textContent='ลองใหม่อีกครั้ง'}
    toast(err.message||'เชื่อมต่อ Stripe ไม่สำเร็จ กรุณาลองใหม่');
  }
}
async function readJsonResponse(response,endpoint){
  const contentType=response.headers.get('content-type')||'';
  if(!contentType.includes('application/json')){
    throw new Error(response.status===404
      ?`ไม่พบ ${endpoint} กรุณา deploy Worker เวอร์ชันล่าสุด`
      :`${endpoint} ส่งข้อมูลไม่ใช่ JSON (HTTP ${response.status}) กรุณาตรวจสอบว่าเปิดจาก Worker URL`);
  }
  try{return await response.json()}catch(_){throw new Error(`${endpoint} ส่ง JSON ไม่ถูกต้อง กรุณาตรวจสอบ Worker`)}
}
function googleLogin(){
  try{sessionStorage.setItem(AUTH_KEY,JSON.stringify({after:S.afterSignup,ev:S.ev,zone:S.zone,qty:S.qty,lid:S.buyingListing&&S.buyingListing.lid}))}catch(_){}
  location.href='/auth/google/start';
}
async function checkAuth(){
  if(!/^https?:$/.test(location.protocol))return;
  let me;try{const r=await fetch('/api/me',{credentials:'same-origin'});if(!r.ok)return;me=await readJsonResponse(r,'/api/me')}catch(err){console.error('Auth API failed',err);return}
  if(!me||!me.googleEnabled)return;
  S.auth.google=true;
  S.signedIn=!!me.user;
  if(me.user)Object.assign(S.user,{name:me.user.name||me.user.email,email:me.user.email||''},me.user.wallet?{wallet:me.user.wallet}:{});
  const q=new URLSearchParams(location.search),result=q.get('login');
  if(result){q.delete('login');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash)}
  let back=null;try{back=JSON.parse(sessionStorage.getItem(AUTH_KEY)||'null');sessionStorage.removeItem(AUTH_KEY)}catch(_){}
  if(back&&me.user){if(back.ev&&evById(back.ev)){S.ev=back.ev;S.zone=back.zone||0;S.qty=back.qty||1}
    S.buyingListing=back.lid?S.listings.find(l=>l.lid==back.lid)||null:null;S.afterSignup=back.after||null}
  render();
  handleCheckoutReturn();
  if(result==='new'&&me.user)walletCreating();
  else if(result==='ok'&&me.user){toast('เข้าสู่ระบบแล้ว');if(S.afterSignup){const n=S.afterSignup;S.afterSignup=null;resumeAfter(n)}}
  else if(result==='error')toast('เข้าสู่ระบบไม่สำเร็จ ลองอีกครั้ง');
}

async function handleCheckoutReturn(){
  const q=new URLSearchParams(location.search);
  const sessionId=q.get('session_id');
  if(q.get('checkout')!=='success'||!sessionId||!S.signedIn)return;
  q.delete('checkout');q.delete('session_id');
  history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);
  S.stack=['paymentSuccess'];S.tab='tickets';render();
  for(let attempt=0;attempt<10;attempt++){
    try{
      const response=await fetch('/api/checkout-status?session_id='+encodeURIComponent(sessionId),{credentials:'same-origin'});
      const data=await readJsonResponse(response,'/api/checkout-status');
      if(data.status==='paid'){render();return}
      if(data.status==='failed'){toast('การชำระเงินไม่สำเร็จ');return}
    }catch(err){console.error('Checkout status failed',err);return}
    await new Promise(resolve=>setTimeout(resolve,1500));
  }
  toast('กำลังรอ Stripe ยืนยันการชำระเงิน กรุณาตรวจสอบตั๋วของฉันอีกครั้ง');
}

/* boot: signed-out home, matching step 1 of the flow */
load();ensureOrg();if(S.mode==='org'){S.tab='orgDash';S.stack=['orgDash']}
applyMode();render();(async()=>{await loadEvents();render();checkAuth()})();
})();

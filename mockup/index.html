<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>JongLoei App Mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Prompt:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
<style>
/* Tokens follow design/tokens.css (handoff 2026-10-16). Dark is the default; light only with <html data-theme="light">. */
:root{
  color-scheme:light;
  --brand:#A00018;          /* logo crimson, fixed in both themes */
  --red:#A00018;            /* primary button, link, selected, price */
  --red-strong:#7E0013;
  --on-red:#FFFFFF;
  --red-soft:var(--surface-2); /* no tinted red any more: selected = solid --red */
  --bg:#F6F3F3;
  --surface:#FFFFFF;
  --surface-2:#FAF7F7;
  --ink:#1E1416;
  --muted:#6E6265;
  --line:#ECE4E5;
  --line-soft:color-mix(in oklab,var(--ink) 8%,transparent);
  --ok:#1D7A48; --ok-soft:#E5F3EB;
  --warn:#9A5B00; --warn-soft:#FBF0DD;
  /* solid status fills: same in both themes, white text */
  --ok-solid:#22BB33; --warn-solid:#FFC107; --danger-solid:#DC2626; --info-solid:#2563EB; --red-solid:#D0021B; --neutral-solid:#898989;
  --scan-ok:#22BB33; --scan-bad:#DC2626;
  --zone-1:#2A78D6; --zone-2:#EB6834; --zone-3:#1BAF7A; --zone-4:#EDA100; --zone-5:#E87BA4;
  --side:#7E0013; --on-side:#FFFFFF;
  --scrim:rgb(18 12 13 / .56);
  --qr-bg:#FFFFFF; --qr-ink:#1E1416;
  --shadow:0 1px 2px rgb(60 10 16 / .06),0 12px 32px rgb(60 10 16 / .14);
  --f-display:"General Sans","Prompt",system-ui,sans-serif;
  --f-body:"General Sans","Anuphan",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#120C0D;--surface:#1C1415;--surface-2:#241A1C;
  --red:#E8485A;--red-strong:#FF6B7B;--on-red:#120C0D;
  --ink:#F5ECED;--muted:#B3A3A6;--line:#35282A;
  --ok:#5CC98C;--ok-soft:#163223;--warn:#F0B35A;--warn-soft:#352612;
  --zone-1:#3987E5;--zone-2:#D95926;--zone-3:#199E70;--zone-4:#C98500;--zone-5:#D55181;
  --side:#3A1519;--on-side:#F5ECED;
  --scrim:rgb(0 0 0 / .64);
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 12px 32px rgb(0 0 0 / .45)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.stage{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:40px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}.stage .devwrap{order:-1;position:relative;top:auto}.stage .device{height:min(780px,calc(100dvh - 32px))}}

/* ---------- flow index ---------- */
.intro{display:flex;flex-direction:column;gap:20px;padding-top:8px;min-width:0}
.brandrow{display:flex;align-items:center;gap:14px}
.brandrow svg{width:52px;height:52px;flex:none}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.06em;color:var(--red)}
.intro p{margin:0;color:var(--muted);max-width:56ch}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;counter-reset:f}
.flow button{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:none}
.flow button:hover{background:var(--surface)}
.flow button.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.flow .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:13px;background:var(--red-soft);color:var(--red)}
.flow button.on .n{background:var(--red);color:var(--on-red)}
.flow b{display:block;font-weight:600}
.flow small{color:var(--muted);font-size:13px}
.legend{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* ---------- device ---------- */
.device{position:relative;width:100%;max-width:400px;margin:0 auto;height:min(820px,calc(100dvh - 48px));min-height:620px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:36px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.appbar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.appbar .ttl{flex:1;font-family:var(--f-display);font-weight:600;font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar svg.logo{width:30px;height:30px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.walletchip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:transparent;color:var(--red);font-size:12px;font-weight:600;border:1px solid var(--red)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.screen{padding:16px 18px 24px;display:flex;flex-direction:column;gap:16px;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);flex:none;padding-bottom:6px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 4px;font-size:11.5px;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--red);font-weight:600}

/* ---------- shared bits ---------- */
.btn{border:0;border-radius:8px;min-height:48px;padding:12px 18px;font-weight:600;font-family:var(--f-display);font-size:16px;background:var(--red);color:var(--on-red);width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease,ease-out)}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--red-strong)}
.btn.ghost{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn.ghost:hover{background:transparent;opacity:.85}
.btn.plain{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.plain:hover{background:var(--surface-2)}
.btn[disabled]{background:var(--neutral-solid);color:#fff;box-shadow:none;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* pills: solid fill, white text, no dot */
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--red-solid);color:#fff;white-space:nowrap}
.pill.ok{background:var(--ok-solid);color:#fff}
.pill.warn{background:var(--warn-solid);color:#fff}
.pill.grey{background:var(--neutral-solid);color:#fff;border:0}
.pill.info{background:var(--info-solid);color:#fff}
/* chips: red outline on the page colour; selected = solid red */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--red);background:var(--bg);color:var(--red);border-radius:999px;min-height:36px;padding:6px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--red);color:var(--on-red);border-color:var(--red)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--muted)}
.search svg{width:18px;height:18px}
.search input{border:0;background:none;outline:none;flex:1;font:inherit;color:var(--ink);min-width:0}
hr.sep{border:0;border-top:1px dashed var(--line);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}

/* posters: typographic, no photos */
.poster{border-radius:16px;position:relative;overflow:hidden;color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;min-height:140px;isolation:isolate}
.poster::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--pbg)}
.poster::after{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 2px,transparent 2px 14px)}
.poster .ptag{position:absolute;top:12px;left:12px;font-size:11px;font-weight:600;letter-spacing:.06em;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:999px}
.poster .pbig{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1;letter-spacing:.01em}
.poster.lg{min-height:200px}.poster.lg .pbig{font-size:28px}

.evlist{display:flex;flex-direction:column;gap:12px}
.ev{display:grid;grid-template-columns:92px 1fr;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:10px;width:100%}
.ev .poster{min-height:92px;padding:8px;border-radius:12px}
.ev .poster .pbig{font-size:13px}
.ev h3{font-size:15.5px;font-weight:600}
.ev .meta{font-size:13px;color:var(--muted)}
.ev .price{font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--ink)}
.ev>div{min-width:0;display:flex;flex-direction:column;gap:3px}

.zones{display:flex;flex-direction:column;gap:8px}
.zone{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;min-height:60px;padding:0 16px;border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;background:var(--surface);text-align:left;width:100%}
.zone .dot{width:12px;height:12px;border-radius:4px;background:var(--zc)}
.zone.on{background:var(--red);color:var(--on-red);box-shadow:inset 0 0 0 2px var(--red)}
.zone.on .muted{color:inherit;opacity:.85}
.zone.on .dot{box-shadow:0 0 0 2px var(--on-red)}
.zone b{font-family:var(--f-display);font-weight:600}
.zone[disabled]{background:var(--surface-2);color:var(--muted)}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px}

.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trust div{background:var(--bg);border:0;border-radius:8px;padding:10px;font-size:12.5px;line-height:1.35}
.trust svg{width:20px;height:20px;color:var(--red);display:block;margin-bottom:4px}

.sticky-cta{position:sticky;bottom:0;background:linear-gradient(to top,var(--surface-2) 85%,transparent);padding:14px 18px 16px;margin:0 -18px -24px;display:flex;gap:10px;align-items:center}
.sticky-cta .tot{flex:none;display:flex;flex-direction:column;line-height:1.2}
.sticky-cta .tot b{font-family:var(--f-display);font-size:20px}

.pay{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;width:100%}
.pay.on{border-color:var(--red)}
.pay .logo{width:40px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:#113566}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.pay.on .radio{border:6px solid var(--red)}

.qrbox{background:var(--qr-bg);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;border:1px solid var(--line);color:#1E1416}
.qrbox canvas{width:220px;height:220px;max-width:100%;image-rendering:pixelated}
.tqr{width:100%;background:#113566;color:#fff;border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;padding-bottom:18px;position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::before{background:var(--red)}
.steps .s{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.steps .s svg{width:16px;height:16px}
.steps li.done .s{background:var(--red);border-color:var(--red);color:var(--on-red)}
.steps li.active .s{border-color:var(--red)}
.steps li.active .s::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--red);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steps b{display:block;font-weight:600}
.steps small{color:var(--muted);font-size:13px}

/* NFT ticket card */
.nft{border-radius:12px;background:var(--surface);border:1px solid var(--line-soft);overflow:hidden}
.nft .poster{border-radius:0;min-height:150px}
.nft .stub{position:relative;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.nft .stub::before,.nft .stub::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.nft .stub::before{left:-12px}.nft .stub::after{right:-12px}
.nft .perf{position:absolute;top:0;left:16px;right:16px;border-top:2px dashed var(--line)}
.tokenid{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--red)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:4px;gap:4px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:none;border-radius:8px;min-height:40px;padding:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--red);color:var(--on-red)}

.ring{display:flex;align-items:center;gap:8px;font-size:13px;color:#6E6265}
.ring svg{width:22px;height:22px;transform:rotate(-90deg)}

.mticket{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:10px}
.mticket .poster{min-height:70px;padding:6px;border-radius:10px}
.mticket .poster .pbig{font-size:11px}
.mticket>div{min-width:0}
.mticket h3{font-size:15px;font-weight:600}

.listing{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.listing .top{display:grid;grid-template-columns:64px 1fr;gap:12px}
.listing .poster{min-height:64px;padding:6px;border-radius:10px}.listing .poster .pbig{font-size:10px}
.listing .top>div{min-width:0}
.strike{text-decoration:line-through;color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--red);border-radius:99px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;min-height:48px;padding:12px;font:inherit;font-size:16px;color:var(--ink);width:100%}
.field input:focus{border-color:var(--red);outline:none}
.hint{font-size:13px;color:var(--muted)}
.hint.err{color:var(--danger-solid);font-weight:600}

.sheet-wrap{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;border-radius:16px 16px 0 0;padding:10px 18px 22px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto;box-shadow:var(--shadow);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto}
.social{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px;font-weight:600;width:100%}
.social .g{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.linkbtn{border:0;background:none;color:var(--red);font-weight:600;padding:0;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

.toast{position:absolute;left:18px;right:18px;bottom:76px;background:var(--ok-solid);color:#fff;border-radius:12px;min-height:52px;padding:12px 16px;font-size:15px;z-index:30;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);animation:up .2s ease}
.toast.err{background:var(--danger-solid)}
.hero-ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:6px}
.hero-ok .big{width:72px;height:72px;border-radius:999px;background:var(--ok-solid);color:#fff;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.hero-ok .big svg{width:34px;height:34px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.wallet-addr{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.wallet-addr .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adv{border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.devwrap{position:sticky;top:max(16px,env(safe-area-inset-top,0px));min-width:0}
.mode{display:inline-grid;grid-template-columns:1fr 1fr;width:max-content;max-width:100%}
.cols,.col,.narrow{display:flex;flex-direction:column;gap:16px;min-width:0}
.ev.feature{grid-template-columns:1fr;padding:0;overflow:hidden}
.d-only{display:none!important}
.browserbar{display:none}
.sgrid{display:grid;gap:16px;grid-template-areas:"hero" "nft" "btns";grid-template-columns:minmax(0,1fr)}
.sgrid .a-hero{grid-area:hero}.sgrid .a-nft{grid-area:nft;min-width:0}.sgrid .a-btns{grid-area:btns;display:flex;flex-direction:column;gap:12px}
.tgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.stage:not(.desk) .tv-hide{display:none}
.tlist,.lgrid{display:flex;flex-direction:column;gap:12px}
.backrow{display:flex;align-items:center;gap:12px}

/* ---------- desktop web mode ---------- */
.stage.desk{grid-template-columns:minmax(0,1fr);max-width:1280px;gap:18px}
.stage.desk .intro{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:0}
.stage.desk .intro>p,.stage.desk .legend{display:none}
.stage.desk .brandrow svg{width:36px;height:36px}.stage.desk .wordmark{font-size:20px}
.stage.desk .mode{margin-left:auto}
.stage.desk .flow{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3;gap:6px;padding-bottom:4px}
.stage.desk .flow li{flex:none}
.stage.desk .flow button{grid-template-columns:24px auto;align-items:center;padding:5px 12px 5px 5px;border-color:var(--line);background:var(--surface);border-radius:999px;gap:8px;box-shadow:none}
.stage.desk .flow button.on{border-color:var(--red)}
.stage.desk .flow small{display:none}.stage.desk .flow b{font-size:13.5px;white-space:nowrap}
.stage.desk .flow .n{width:24px;height:24px;font-size:12px}
.stage.desk .devwrap{position:static;overflow-x:auto;border-radius:14px}
.stage.desk .device{max-width:none;min-width:1000px;border-radius:14px;height:min(860px,calc(100dvh - 150px));min-height:640px}
.stage.desk .browserbar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);flex:none}

.stage.desk .tlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}

/* ---------- full-viewport app (no demo frame) ---------- */
html,body{height:100%}
body{padding:0}
.stage,.stage.desk{display:block;max-width:none;height:100%;margin:0}
.devwrap,.stage .devwrap,.stage.desk .devwrap{position:static;height:100%;overflow:visible;border-radius:0}
.device,.stage .device,.stage.desk .device{max-width:none;min-width:0;width:100%;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}
.appbar,.screen{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.tabbar{padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
.search input::-webkit-search-cancel-button{cursor:pointer}
.listing .ptag,.mticket .ptag{display:none}

/* ---------- organizer ---------- */
.field select,.field textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font:inherit;color:var(--ink);width:100%}
.field select:focus,.field textarea:focus{border-color:var(--red);outline:none}
.field [aria-invalid="true"]{border-color:var(--red)}
.hint.err:empty{display:none}
.org-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stage.desk .org-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.org-stat{display:flex;flex-direction:column;gap:2px}.org-stat b{font-family:var(--f-display);font-size:22px;color:var(--ink)}
.org-todo{list-style:none;margin:0;display:flex;flex-direction:column;gap:10px}.org-todo li{line-height:1.4}
.org-chart svg{display:block;max-width:100%;height:auto}
.org-tip{position:absolute;top:0;background:var(--ink);color:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;pointer-events:none;white-space:nowrap}
.org-table{width:100%;border-collapse:collapse;margin-top:8px}.org-table th,.org-table td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.org-table td{text-align:right}
.org-evcard .top{display:grid;grid-template-columns:64px 1fr;gap:12px}
.org-swatch{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer}.org-swatch.on{border-color:var(--ink);outline:2px solid var(--surface);outline-offset:-4px}
.org-wiz .field input:disabled,.org-wiz .field select:disabled{opacity:.6}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.five{grid-template-columns:repeat(5,1fr)}.seg.five button{padding:8px 4px;font-size:12.5px}
@media print{
  html,body{height:auto!important;background:#fff!important}
  #appbar,#tabbar,.no-print,.toast,.sheet-wrap{display:none!important}
  .stage,.devwrap,.device,.scroll{height:auto!important;overflow:visible!important;position:static!important;border:0!important;box-shadow:none!important}
  .screen{padding:0!important;max-width:none!important;animation:none!important}
}
/* scan result: fixed colours in both themes so a door scan reads the same everywhere */
.org-result{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#fff;text-align:center}
.org-result.ok{background:var(--scan-ok)}.org-result.bad{background:var(--scan-bad)}
.org-result svg{color:#fff}
.org-danger{border-color:var(--danger-solid);box-shadow:inset 0 0 0 1px var(--danger-solid)}.btn.org-danger-btn{background:var(--danger-solid);color:#fff}
.org-danger .btn.org-danger-btn{width:auto;align-self:flex-end}
.org-progress{display:flex;gap:6px}.org-progress i{flex:1;height:6px;border-radius:9px;background:var(--line)}.org-progress i.on{background:var(--red)}

/* =====================================================================
   v2 layouts (Claude Design canvas, rounds 2–9). Old blocks above stay for screens not yet moved.
   ===================================================================== */
.screen.v2{max-width:none!important;padding:0!important;gap:0!important}
.wrap{width:100%;max-width:1184px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:24px}
.stage.desk .wrap{padding:32px 32px 56px;gap:32px}
.wrap.narrow-w{max-width:600px}.stage.desk .wrap.narrow-w{max-width:664px}
.ic{width:20px;height:20px;flex:none}
.h2{font-size:18px;line-height:1.3}.stage.desk .h2{font-size:22px}
.lnk{color:var(--red);font-size:14px;font-weight:600;text-decoration:none;background:none;border:0;padding:0}
.crumb{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;border:0;background:none;padding:0;color:var(--muted);font-size:14px;font-weight:500}
.crumb svg{width:16px;height:16px}

/* app bars */
.appbar{min-height:56px;padding:0 8px 0 16px;gap:12px}
.appbar .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:none;padding:0}
.appbar .brand svg{width:28px;height:28px;flex:none}
.appbar .brand span{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;color:var(--brand)}

.appbar .ib{width:44px;height:44px;border:0;border-radius:8px;background:none;color:var(--ink);display:grid;place-items:center;flex:none}
.appbar .ib svg{width:22px;height:22px}
.appbar .ttl{font-size:16px}
.appbar .chipbtn{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--red);background:transparent;color:var(--red);font-size:13px;font-weight:600;white-space:nowrap}
.stage.desk .appbar{height:64px;padding:0 32px;gap:24px}
.stage.desk .appbar .brand{flex:none}
.stage.desk .appbar .brand svg{width:32px;height:32px}
.stage.desk .appbar .brand span{font-size:18px}
.dnav{display:flex;gap:4px}
.dnav button{height:40px;padding:0 14px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:600;font-size:14px}
.dnav button:hover{color:var(--ink);background:var(--surface-2)}
.dnav button.on{background:var(--red);color:var(--on-red)}
.dsearch{flex:1;max-width:320px;margin-left:auto;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--muted)}
.dsearch svg{width:18px;height:18px;flex:none}
.dsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:14px;color:var(--ink)}
.avatar{width:40px;height:40px;border-radius:999px}
/* focus mode title row: back on the left, title centred */
.titlerow{align-self:stretch;position:relative;display:flex;align-items:center;justify-content:center;min-height:44px}
.titlerow h1{font-size:22px;line-height:1.25;text-align:center;padding:0 52px}
.stage.desk .titlerow h1{font-size:28px}
.titlerow .back{position:absolute;left:0;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:8px;background:none;color:var(--ink);display:grid;place-items:center}
.titlerow .back svg{width:22px;height:22px}

/* hero banner */
.hero{position:relative;overflow:hidden;color:#fff;background:var(--hbg)}
.hero-in{min-height:316px;padding:20px 16px 8px;display:flex;flex-direction:column;gap:10px;justify-content:flex-end}

.hero-ctl .arw svg{width:20px;height:20px}
.dots{display:flex;gap:4px}
.dots button{height:24px;padding:0 4px;border:0;background:transparent;color:#fff;display:grid;place-items:center}

.stage.desk .hero-in{height:400px;min-height:0;padding:40px 96px 64px;max-width:760px;gap:16px;justify-content:center}

.stage.desk .hero h2{font-size:44px}

.stage.desk .hero-ctl{position:absolute;inset:0;padding:0;pointer-events:none}
.stage.desk .hero-ctl .arw{position:absolute;top:50%;transform:translateY(-50%);background:var(--surface);color:var(--ink);pointer-events:auto}

/* search block */
.hsearch{display:flex;flex-direction:column;gap:12px}
.hsearch label{height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted)}

.hsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--ink)}
.hsearch .flt{display:flex;gap:8px;overflow-x:auto}
.hsearch .flt button{flex:none;height:36px;padding:0 12px;border:1px solid var(--red);border-radius:999px;background:var(--bg);color:var(--red);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.hsearch .flt svg{width:14px;height:14px}
.stage.desk .hsearch{flex-direction:row;align-items:center;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft)}

.hsearch .go{display:none}
.stage.desk .hsearch .go{display:inline-flex;height:48px;padding:0 24px;border:0;border-radius:8px;align-items:center;background:var(--red);color:var(--on-red);font-family:var(--f-display);font-weight:600;font-size:16px}

/* event cards */
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.evgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.stage.desk .evgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.evc{border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;background:var(--surface);color:var(--ink);text-align:left;display:flex;flex-direction:column;padding:0;width:100%}

.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface);color:var(--ink);white-space:nowrap}

.bigbtn.sec{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.bigbtn.plain{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.buybar{position:sticky;bottom:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px 20px;background:var(--surface);border-top:1px solid var(--line)}
.buybar .t{display:flex;flex-direction:column;flex:none;line-height:1.2}
.buybar .t span{font-size:12px;color:var(--muted)}
.buybar .t b{font-family:var(--f-display);font-weight:600;font-size:24px}
.stage.desk .buybar{display:none}
.m-hide{display:none}.stage.desk .m-hide{display:flex}
.vstack{display:flex;flex-direction:column;gap:12px}
.stage.desk .d-hide{display:none}
.stage:not(.desk) .m-hide{display:none}
.stage:not(.desk) .foot{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* v2: purchase flow, tickets, market, profile */
.zchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--zc,var(--zone-1));color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.zchip svg{width:14px;height:14px}
.ocard{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft)}
.thumb{width:72px;height:72px;border-radius:8px;padding:6px;display:flex;align-items:flex-end;color:#fff;background:repeating-linear-gradient(135deg,rgb(255 255 255 / .07) 0 2px,transparent 2px 14px),var(--pbg)}
.thumb b{font-family:var(--f-display);font-weight:600;font-size:11px;line-height:1.05;white-space:pre-line}
.ocard .info{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px}
.ocard .info b{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.35}
.sect{display:flex;flex-direction:column;gap:12px}
.sect>h2{font-size:17px}
.payopt{display:grid;grid-template-columns:44px 1fr 20px;gap:12px;align-items:center;min-height:64px;padding:10px 14px;border:0;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--red);text-align:left;color:var(--ink);width:100%}
.payopt .lg{width:44px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:#113566}
.payopt .rd{width:20px;height:20px;border-radius:999px;border:6px solid var(--red)}
.note{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.ctr{align-items:center;text-align:center}
.cd{margin:0;font-size:15px}
.cd b{font-family:var(--f-display);font-weight:600;font-size:22px;color:var(--red)}
.qrcard{align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;border-radius:12px;background:var(--qr-bg);color:#1E1416}
.qrcard canvas{width:220px;height:220px;max-width:100%;image-rendering:pixelated}
.qrcard .tqr{width:100%}
.qrcard .amt{font-family:var(--f-display);font-weight:600;font-size:28px;color:#A00018}
.rows{align-self:stretch;margin:0;display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft);font-size:15px;text-align:left}
.rows dd{margin:0;text-align:right}
.btncol{align-self:stretch;display:flex;flex-direction:column;gap:10px}
.stage.desk .btncol.row2{flex-direction:row}.stage.desk .btncol.row2>*{flex:1}
.ftitle{font-size:24px;line-height:1.25}.stage.desk .ftitle{font-size:30px}
.okc{width:80px;height:80px;border-radius:999px;display:grid;place-items:center;background:var(--ok-solid);color:#fff;animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
.okc svg{width:42px;height:42px}
.okc .draw{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#mintsteps{align-self:stretch;text-align:left;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft)}
/* ticket card (poster stub + perforation) */
.tcard{align-self:stretch;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line-soft);text-align:left}
.tcard .pst{aspect-ratio:16/7;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:repeating-linear-gradient(135deg,rgb(255 255 255 / .07) 0 2px,transparent 2px 14px),var(--pbg)}
.tcard .pst .big{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1;white-space:pre-line}
.tcard .stub{position:relative;padding:18px 16px 16px;display:flex;flex-direction:column;gap:10px}
.tcard .stub::before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:2px dashed var(--line)}
.tcard h3{font-size:18px;line-height:1.3}
.kv2{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv2 dt{color:var(--muted)}.kv2 dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.chain{border-top:1px solid var(--line);padding-top:10px}
.chain summary{display:flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.chain summary::-webkit-details-marker{display:none}
.chain summary .ic{margin-left:auto;transition:transform .15s}
.chain[open] summary .ic{transform:rotate(180deg)}
.chain .kv2{padding:8px 0 4px}
/* tickets list */
.tklist{display:flex;flex-direction:column;gap:12px}
.stage.desk .tklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tk{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface);text-align:left;color:var(--ink);width:100%}
.tk .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.tk h3{font-size:16px;line-height:1.35}
.tk .meta{font-size:13px;color:var(--muted)}
.tgrid2{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.stage.desk .tgrid2{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px}
.qrstate{padding:40px 10px;text-align:center;color:#6E6265;line-height:1.5}
/* market */
.lgrid2{display:flex;flex-direction:column;gap:12px}
.stage.desk .lgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lst{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:14px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface)}
.lst .info{min-width:0;display:flex;flex-direction:column;gap:6px}
.lst h3{font-size:16px;line-height:1.35}
.lst .foot2{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.ptone{display:flex;flex-direction:column;line-height:1.2}
.ptone .was{font-size:13px;color:var(--muted);text-decoration:line-through}
.ptone .now{font-family:var(--f-display);font-weight:600;font-size:24px}
.ptone .orig{font-size:13px;color:var(--muted)}
.ptone.low .now{color:var(--ok-solid)}.ptone.high .now{color:var(--red)}
/* profile */
.prof{display:flex;align-items:center;gap:16px}
.prof .av{width:64px;height:64px;border-radius:999px;display:grid;place-items:center;background:var(--red);color:var(--on-red);font-family:var(--f-display);font-weight:600;font-size:26px;flex:none}
.pcard{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft)}
.addr{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border-radius:8px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.addr .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr button{width:40px;height:40px;border:0;border-radius:8px;background:none;color:var(--ink);display:grid;place-items:center}
.addr button svg{width:18px;height:18px}
.addr button.done{color:var(--ok-solid)}
.sw{width:52px;height:32px;padding:3px;border:0;border-radius:999px;display:flex;background:var(--neutral-solid);flex:none}
.sw span{width:26px;height:26px;border-radius:999px;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--ok-solid)}
.sw[aria-checked="true"] span{transform:translateX(20px)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.stage.desk .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.gbtn{height:52px;border:0;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1F1F1F;box-shadow:inset 0 0 0 1px #DADCE0;font-weight:600;font-size:16px;width:100%}
.bigbtn:disabled{box-shadow:none}
.tabbar[hidden]{display:none}
.stage:not(.desk) .ocard{grid-template-columns:72px minmax(0,1fr)}
.stage:not(.desk) .ocard>.zchip{grid-column:2;justify-self:start}

/* v2: organizer shell and screens */
.appbar[hidden]{display:none}
.side{display:flex;flex-direction:column;gap:20px;padding:20px 16px;background:var(--side);color:var(--on-side);overflow-y:auto}
.side[hidden]{display:none}
.device.org-desk{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.device.org-desk .side{grid-column:1;grid-row:1}
.device.org-desk #scroll{grid-column:2;grid-row:1}
.side-logo{display:flex;align-items:center;gap:10px}
.side-logo svg{width:32px;height:32px}
.side-logo span{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em}
.side-shop{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:8px;background:rgb(255 255 255 / .1)}
.side-shop span{font-size:12px;font-weight:600;opacity:.9}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav button,.side-back{height:44px;padding:0 12px;border:0;border-radius:8px;display:flex;align-items:center;gap:10px;background:transparent;color:inherit;opacity:.82;font-size:14px;font-weight:600;text-align:left}
.side-nav svg,.side-back svg{width:20px;height:20px}
.side-nav button:hover{opacity:1;background:rgb(255 255 255 / .1)}
.side-nav button[aria-current="page"]{opacity:1;background:rgb(255 255 255 / .16)}
.side-back{margin-top:auto;opacity:1;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .28)}
.wrap.org{max-width:1280px}
/* page head: mobile = centred title, shop row, full-width action; desk = title left, action right */
.ohead{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.ohead h1{flex-basis:100%;text-align:center;font-size:22px;line-height:1.25}
.oshop{flex-basis:100%;display:flex;justify-content:space-between;align-items:center;gap:12px}
.oshop b{font-family:var(--f-display);font-weight:600}
.ohead>.btn{width:100%}
.stage.desk .ohead h1{flex-basis:auto;text-align:left;font-size:30px}
.stage.desk .oshop{display:none}
.stage.desk .ohead>.btn{width:auto;margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stage.desk .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{min-width:0;display:flex;flex-direction:column;gap:4px;padding:16px 20px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft)}
.stat>span{font-size:13px;color:var(--muted)}
.stat>b{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.2}
.stage.desk .stat>b{font-size:28px}
.stat>small{font-size:12px;color:var(--muted)}
.stat.locked>b{color:var(--muted)}
.split84{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.stage.desk .split84{grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:16px}
.ocard2{min-width:0;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft)}
.ocard2>h2{font-size:17px}
.org-todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.org-todo li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.org-todo li:last-child{border-bottom:0}
.org-todo .linkbtn{text-decoration:none}
/* organizer event cards */
.oevgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.stage.desk .oevgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.oev{min-width:0;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft)}
.oev-top{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:start}
.oev-open{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.oev-open .thumb{width:64px;height:64px}
.oev-info{min-width:0;display:flex;flex-direction:column;gap:4px}
.oev-info b{font-size:16px;line-height:1.35}
.oev-info .pill{align-self:flex-start}
.oev-menu{width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center}
.oev-menu svg{width:20px;height:20px}
.pbar{display:flex;flex-direction:column;gap:6px}
.pbar-t{height:20px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar-t span{display:flex;align-items:center;justify-content:flex-end;min-width:40px;height:100%;padding-right:8px;box-sizing:border-box;border-radius:999px;background:var(--red);color:var(--on-red);font-size:12px;font-weight:600}
.pill.danger{background:var(--danger-solid);color:#fff}
.pill.info{background:var(--info-solid);color:#fff}
/* welcome */
.ohero{padding:40px 16px;color:#fff;background:repeating-linear-gradient(135deg,rgb(255 255 255 / .07) 0 2px,transparent 2px 14px),linear-gradient(135deg,#C2001F,#7E0013 55%,#2A0A0D)}
.ohero .in{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.ohero h1{font-size:30px;line-height:1.2;max-width:18ch;color:#fff}
.ohero p{margin:0;font-size:15px;opacity:.9;max-width:52ch}
.ohero .acts{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:12px}
.ohero .acts button{height:52px;padding:0 24px;border:0;border-radius:8px;font-family:var(--f-display);font-weight:600;font-size:16px}
.ohero .pri{background:#fff;color:var(--brand)}
.ohero .sec{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgb(255 255 255 / .7)}
.stage.desk .ohero{padding:72px 32px}
.stage.desk .ohero h1{font-size:44px}
.stage.desk .ohero .acts{flex-direction:row;width:auto}
.wgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;align-items:start}
.stage.desk .wgrid{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.benefits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.benefits li{display:grid;grid-template-columns:28px 1fr;gap:12px}
.benefits .n{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--red);color:var(--on-red);font-weight:600;font-size:14px}
.benefits b{font-size:16px}
.benefits p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.fee{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:15px}
.fee dd{margin:0;text-align:right}
.fee .t{padding-top:6px;border-top:1px solid var(--line);font-weight:600}
.fee .t+dd{padding-top:6px;border-top:1px solid var(--line);font-family:var(--f-display);font-weight:600;font-size:20px}
/* line stepper (wizards) */
.lstep{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column}
.lstep::before,.lstep::after{content:"";position:absolute;top:12.5px;left:12.5%;height:3px;border-radius:999px}
.lstep::before{right:12.5%;background:var(--line)}
.lstep::after{width:calc(75% * var(--fill,0));background:var(--red)}
.lstep li{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px;font-size:12px;font-weight:600;line-height:1.3;text-align:center;color:var(--muted)}
.lstep li>button{display:contents;color:inherit;font:inherit}
.lstep .d{width:28px;height:28px;display:grid;place-items:center;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line);font-size:13px}
.lstep li.done,.lstep li.cur{color:var(--ink)}
.lstep li.done .d{background:var(--red);color:var(--on-red);box-shadow:none}
.lstep li.cur .d{background:var(--red);color:var(--on-red);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--red)}
.stage.desk .lstep li{font-size:14px}
/* manage event */
.ehead{display:flex;flex-direction:column;gap:16px}
.ehead .row1{display:flex;gap:16px;align-items:center}
.ehead .thumb{width:72px;height:72px}
.ehead .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ehead h1{font-size:20px;line-height:1.25}
.ehead .acts{display:flex;flex-wrap:wrap;gap:8px}
.ehead .acts .btn{flex:1;width:auto;min-height:44px;padding:0 16px;font-size:15px}
.stage.desk .ehead{flex-direction:row;align-items:center}
.stage.desk .ehead .row1{flex:1}
.stage.desk .ehead .thumb{width:88px;height:88px}
.stage.desk .ehead h1{font-size:28px}
.stage.desk .ehead .acts .btn{flex:none}
.utabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.utabs button{flex:none;height:44px;padding:0 12px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-size:15px;font-weight:600}
.utabs button[aria-selected="true"]{border-bottom-color:var(--red);color:var(--red)}
.stage.desk .utabs button{padding:0 16px}
/* org leftovers restyled */
.org-stat{border-radius:12px}
.org-zone{border-radius:12px;padding:20px}
.org-danger .btn.org-danger-btn{width:auto;align-self:flex-end}
.field select,.field textarea{background:var(--bg);border-radius:8px}
.field input,.field select{min-height:48px}
.org-table th,.org-table td{padding:10px 8px}
.org-progress{display:none}

.gpick{display:grid;grid-template-columns:72px minmax(0,1fr) 20px;gap:14px;align-items:center;padding:14px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left;width:100%}
.gpick .ic{color:var(--muted)}
.gcount{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft);text-align:center}
.gcount #gate-count{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1}
.stage.desk .gcount #gate-count{font-size:34px}
.gcount .pbar-t{align-self:stretch}
.fgrid{display:flex;flex-direction:column;gap:12px}
.stage.desk .fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.acct-ic{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:var(--info-solid);color:#fff;flex:none}
.acct-ic svg{width:22px;height:22px}
.ehead .acts .btn{white-space:nowrap;font-size:14px}
.org-wiz .lstep{margin-bottom:8px}
.org-wiz .chips{flex-wrap:wrap}
.org-wiz .chips>.small{flex-basis:100%}

.cam{position:relative;aspect-ratio:1/1;max-height:420px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2A2224,#0D0A0B 75%)}
.cam .frame{position:absolute;inset:14%;width:72%;height:72%}
.cam .line{position:absolute;left:14%;right:14%;height:2px;background:var(--red);box-shadow:0 0 12px var(--red);animation:scanline 2.4s ease-in-out infinite}
@keyframes scanline{0%,100%{top:14%}50%{top:82%}}
.cam .hint2{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:rgb(255 255 255 / .85);font-size:13px}
.org-result .ric{width:120px;height:120px;border-radius:999px;display:grid;place-items:center;background:rgb(255 255 255 / .18)}
.org-result .rtitle{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:1.1}
.org-result .rzone{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;background:var(--zone-1);font-size:18px;font-weight:600;box-shadow:0 0 0 2px rgb(255 255 255 / .6)}

function guardMode(){
  const cur=S.stack[S.stack.length-1],isOrg=cur.startsWith('org');
  const reset=(s,tab)=>{S.stack=[s];S.tab=tab||s};
  if(S.mode!=='org'){if(isOrg)reset('home');return}
  // organizer sign-in is its own state: no account -> log-in screen, account without a shop -> onboarding
  if(!S.org.account){if(cur!=='orgWelcome')reset('orgWelcome','orgDash');return}
  if(!S.org.shop){if(cur!=='orgOnboard')reset('orgOnboard','orgDash');return}
  const live=S.org.live,gateHome=live?'orgEvents':'orgGatePick';
  if(!isOrg||cur==='orgWelcome'||cur==='orgOnboard')return reset(S.org.role==='gate'?gateHome:'orgDash');
  if(S.org.role==='gate'&&!(live?['orgEvents','orgEvent']:['orgGatePick','orgGate']).includes(cur))return reset(gateHome);
  if(live&&['orgGatePick','orgGate','orgFinance'].includes(cur))return reset('orgDash');
  if(S.org.role!=='owner'&&['orgFinance','orgTeam'].includes(cur))return reset('orgDash');
}

// zone chip: solid zone colour, white type icon + name
function zchip(e,name){
  const i=e.zones.findIndex(z=>z.z===name),z=e.zones[i]||{};
  const kind=z.kind||(/seat|zone|vip|front|row|ที่นั่ง|บัตร/i.test(name)?'seated':'standing');

}

}

function orgChart(days){
  const W=560,H=180,pl=34,pb=26,pt=14,max=Math.max(1,...days.map(d=>d.count));
  const top=max<=4?4:Math.ceil(max/4)*4,plotH=H-pb-pt,slot=(W-pl-8)/days.length,bw=Math.min(24,slot-8);
  const y=v=>pt+plotH-(v/top)*plotH;
  const dl=d=>{const x=new Date(d*DAY);return x.getUTCDate()+'/'+(x.getUTCMonth()+1)};
  const ticks=[0,top/2,top].map(v=>`<line x1="${pl}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('');
  const peak=days.reduce((m,d,i)=>d.count>days[m].count?i:m,0);
  const bars=days.map((d,i)=>{
    const x=pl+i*slot+(slot-bw)/2,h=Math.max(d.count?4:0,(d.count/top)*plotH),yy=pt+plotH-h,r=Math.min(4,h);
    const path=d.count?`M${x},${yy+h}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${yy+h}Z`:'';
    return `<g><rect x="${pl+i*slot}" y="${pt}" width="${slot}" height="${plotH+pb}" fill="transparent" data-bar data-i="${i}" data-count="${d.count}" data-amount="${d.amount}" data-label="${dl(d.day)}" tabindex="0" role="img" aria-label="${dl(d.day)}: ${d.count} ใบ"/>
      ${path?`<path d="${path}" fill="var(--red)" pointer-events="none"/>`:''}
      ${i%2===(days.length-1)%2?`<text x="${pl+i*slot+slot/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${dl(d.day)}</text>`:''}
      ${i===peak&&d.count?`<text x="${pl+i*slot+slot/2}" y="${yy-5}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${d.count}</text>`:''}</g>`;
  }).join('');
  return `<div id="org-chart" class="org-chart" style="position:relative"><svg viewBox="0 0 ${W} ${H}" width="100%" role="group" aria-label="กราฟแท่งตั๋วที่ขายได้ต่อวัน 14 วันล่าสุด">${ticks}<line x1="${pl}" x2="${W-8}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>${bars}</svg>
    <div id="org-tip" class="org-tip" role="status" hidden></div>
    <details class="small" style="margin-top:6px"><summary>ดูเป็นตาราง</summary>
      <table id="org-chart-table" class="org-table"><thead><tr><th scope="col">วันที่</th><th scope="col">ตั๋ว (ใบ)</th><th scope="col">ยอดขาย</th></tr></thead>
      <tbody>${days.map(d=>`<tr><th scope="row">${dl(d.day)}</th><td class="num">${d.count}</td><td class="num">${OL.fmtBaht(d.amount)}</td></tr>`).join('')}</tbody></table></details></div>`;
}

// form field with a label, an error slot wired by aria-describedby and an optional hint
function fld(id,label,o={}){
  const {value='',type='text',hint='',err='',attrs='',options=null,tag='input'}=o;
  const desc=`${id}-err`+(hint?` ${id}-hint`:'');
  const common=`id="${id}" aria-describedby="${desc}" ${err?'aria-invalid="true"':''} ${attrs}`;
  const control=options?`<select ${common}>${options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`).join('')}</select>`
    :tag==='textarea'?`<textarea ${common} rows="4">${esc(value)}</textarea>`
    :`<input ${common} type="${type}" value="${esc(value)}">`;
  return `<div class="field"><label for="${id}">${label}</label>${control}
    ${hint?`<span class="hint" id="${id}-hint">${hint}</span>`:''}<span class="hint err" id="${id}-err" role="alert">${esc(err)}</span></div>`;
}

const fromLocalInput=s=>s?Date.parse(s+':00Z')-7*HOUR:null;

function mkZone(name,kind,baht,cap,seats,i){

function wizOrig(){const d=S.org.draft;const e=d&&orgEv(d.id);return e&&e.status!=='draft'?e:null}
const origZone=z=>{const o=wizOrig();return o&&o.zones.find(x=>x.id===z.id)};

// reads the inputs of the current step into S.org.draft
function wizCollect(){
  const o=S.org,d=o.draft;if(!d||!document.getElementById('w-name')&&o.wizStep===1)return;
  const g=id=>document.getElementById(id);
  if(o.wizStep===1){
    d.name=val('w-name');d.short=val('w-short').replace(/\\n/g,'\n');d.category=val('w-cat')||d.category;d.description=g('w-desc').value;d.venue=val('w-venue');d.mapUrl=val('w-map');
    d.startAt=fromLocalInput(val('w-start'));d.endAt=fromLocalInput(val('w-end'));d.doorsAt=fromLocalInput(val('w-doors'));
  }else if(o.wizStep===2){
    d.zones.forEach((z,i)=>{
      if(!g('z'+i+'-name'))return;
      z.name=val('z'+i+'-name');
      if(!g('z'+i+'-price').disabled){
        z.kind=val('z'+i+'-kind');z._priceText=g('z'+i+'-price').value.trim();
        const p=OL.toSatang(z._priceText);z.price=z.kind==='comp'?0:Number.isNaN(p)?0:p;
      }
      const cap=g('z'+i+'-cap').value.trim();z.capacity=cap===''?0:Number(cap);if(Number.isNaN(z.capacity))z.capacity=0;
      const seats=g('z'+i+'-seats');z.seatsPerUnit=z.kind==='table'&&seats?Number(seats.value)||0:null;
      if(g('z'+i+'-open')){z.saleStartAt=fromLocalInput(val('z'+i+'-open'));z.saleEndAt=fromLocalInput(val('z'+i+'-close'))}
      z.color=val('z'+i+'-color')||z.color;
    });
  }else if(o.wizStep===3){
    d.params.resaleEnabled=g('w-resale').checked;d.params.capMultiplier=Math.round(Number(g('w-capm').value))/100;
  }
}
function wizErrors(){
  const d=S.org.draft,out={...OL.validateEvent(d,Date.now()).errors};
  if(wizOrig())delete out.startAt;                    // already-running events keep their start date
  if(S.org.live)Object.assign(out,liveWizErrors(d));
  d.zones.forEach((z,i)=>{const oz=origZone(z);if(!oz)return;
    const c=OL.canEditZone(oz,{capacity:z.capacity});if(!c.ok)out[`zones.${i}.capacity`]=c.reason});
  return out;
}
const ERR_FIELD={name:'w-name',venue:'w-venue',startAt:'w-start',endAt:'w-end',capMultiplier:'w-capm',zones:'zones'};
const ZERR_FIELD={name:'name',price:'price',capacity:'cap',seatsPerUnit:'seats',saleStartAt:'open',saleEndAt:'close'};
function errField(key){const m=/^zones\.(\d+)\.(\w+)$/.exec(key);return m?`z${m[1]}-${ZERR_FIELD[m[2]]}`:ERR_FIELD[key]}

function zoneTotals(d){
  let cap=0,rev=0,fees=0;
  for(const z of d.zones){const c=Number.isInteger(z.capacity)?z.capacity:0,p=Number.isInteger(z.price)?z.price:0;
    cap+=c;if(z.kind!=='comp'){rev+=p*c;fees+=OL.serviceFee(p)*(p>0?c:0)}}
  return {cap,rev,fees,net:rev-fees};
}
function wizSummaryHtml(d){

}

function wizLive(){
  const o=S.org;wizCollect();o.wizDirty=true;
  const s=document.getElementById('wiz-summary');if(s)s.innerHTML=wizSummaryHtml(o.draft);
  const x=document.getElementById('w-cap-example');if(x)x.textContent=capExample(o.draft);
  const p=document.getElementById('wiz-preview');if(p)p.innerHTML=wizPreviewInner(o.draft);
  const lab=document.getElementById('w-capm-val');if(lab)lab.textContent=o.draft.params.capMultiplier.toFixed(2)+' เท่า';
  const c=document.getElementById('w-desc-count');if(c)c.textContent=document.getElementById('w-desc').value.length+'/1000';
  wizPaint();
}
$('#device').addEventListener('input',e=>{if(e.target.closest('.org-wiz'))wizLive()});
window.addEventListener('beforeunload',e=>{if(S.org&&S.org.wizDirty&&S.stack[S.stack.length-1]==='orgWizard'){e.preventDefault();e.returnValue=''}});

function wizZoneCard(z,i,errs,n){

  const priceText=z._priceText!==undefined?z._priceText:(z.price?String(z.price/100):'');
  return `<div class="card org-zone" data-i="${i}" style="display:flex;flex-direction:column;gap:10px">
    <div class="row between"><b style="display:flex;gap:8px;align-items:center"><span style="width:12px;height:12px;border-radius:4px;background:${z.color}"></span>โซน ${i+1}</b>
      <span class="row" style="gap:4px"><button class="iconbtn" data-o="wizZoneUp" data-i="${i}" aria-label="เลื่อนโซน ${i+1} ขึ้น" ${i===0?'disabled':''}>↑</button>
      <button class="iconbtn" data-o="wizZoneDown" data-i="${i}" aria-label="เลื่อนโซน ${i+1} ลง" ${i===n-1?'disabled':''}>↓</button>
      <button class="iconbtn" data-o="wizZoneDel" data-i="${i}" aria-label="ลบโซน ${i+1}" ${locked?'disabled':''}><svg><use href="#i-x"/></svg></button></span></div>
    ${fld(`z${i}-name`,'ชื่อโซน',{value:z.name,err:e('name'),attrs:'maxlength="40"'})}
    ${fld(`z${i}-kind`,'ประเภท',{value:z.kind,options:S.org.live?ZONE_KINDS.slice(0,2):ZONE_KINDS,attrs:locked?'disabled':''})}
    ${fld(`z${i}-price`,'ราคา (บาท)',{value:priceText,err:e('price'),attrs:`inputmode="decimal" ${locked||z.kind==='comp'?'disabled':''}`,hint:locked?lockReason(z):z.kind==='comp'?'บัตรเชิญไม่มีราคา':''})}
    ${fld(`z${i}-cap`,z.kind==='table'?'จำนวนโต๊ะ':'จำนวนที่ขาย',{value:String(z.capacity||''),err:e('capacity'),attrs:'inputmode="numeric"'})}
    ${z.kind==='table'&&!S.org.live?fld(`z${i}-seats`,'ที่นั่งต่อโต๊ะ',{value:String(z.seatsPerUnit||''),err:e('seatsPerUnit'),hint:'ผู้ซื้อ 1 คนจ่ายยอดเดียวต่อโต๊ะ',attrs:'inputmode="numeric"'}):''}
    ${S.org.live?'':`${fld(`z${i}-open`,'เปิดขาย (ไม่บังคับ)',{value:toLocalInput(z.saleStartAt),type:'datetime-local',err:e('saleStartAt')})}
    ${fld(`z${i}-close`,'ปิดขาย (ไม่บังคับ)',{value:toLocalInput(z.saleEndAt),type:'datetime-local',err:e('saleEndAt'),hint:'ทำ Early Bird ได้ด้วยการสร้างสองโซนที่ปิดขายคนละเวลา'})}`}
    ${fld(`z${i}-color`,'สีโซน',{value:z.color,options:ZONE_COLORS})}
  </div>`;
}

function wizUpsert(){
  const o=S.org,d=JSON.parse(JSON.stringify(o.draft)),cur=orgEv(d.id);
  d.zones.forEach(z=>{const c=cur&&cur.zones.find(x=>x.id===z.id);if(c){z.sold=c.sold;z.held=c.held}});
  if(cur&&cur.status!=='draft')d.status=cur.status;
  const i=o.events.findIndex(e=>e.id===d.id);if(i<0)o.events.push(d);else o.events[i]=d;
  refreshEvents();return d;
}

  sheet(`<h2 style="font-size:19px">ยังไม่ได้บันทึก</h2><p class="small muted" style="margin:0">ต้องการเก็บสิ่งที่กรอกไว้เป็นร่างไหม</p>

}

/* ---------- organizer: event management ---------- */
const TICKET_STATUS={valid:'พร้อมใช้',listed:'ลงขายอยู่',used:'ใช้แล้ว',refunded:'คืนเงินแล้ว',unavailable:'ไม่มา'};
const evTickets=id=>S.org.tickets.filter(t=>t.eventId===id);
// revenue figures from what buyers actually paid (promo discounts included); drafts have no tickets so use list prices
const evSum=e=>OL.summarize(e,e.status==='draft'||S.org.live?undefined:evTickets(e.id).filter(t=>t.status!=='refunded'));
const maskEmail=m=>{const [a,b]=String(m).split('@');return b?a.slice(0,1)+'***@'+b:'***'};
const csvCell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};

function evOverview(e){
  const s=evSum(e),ro=['ended','cancelled'].includes(e.status);
  const act=e.status==='on_sale'&&!S.org.live?`<button class="btn plain" data-o="pause">พักการขาย</button>`
    :e.status==='paused'?`<button class="btn" data-o="resume">เปิดขายต่อ</button>`
    :e.status==='draft'?`<button class="btn" data-o="editEvent" data-id="${e.id}">แก้ไขและเผยแพร่</button>`:'';
  return `<div class="org-stats">
      <div class="card org-stat"><span class="small muted">ขายแล้ว</span><b class="num">${s.sold}/${s.capacity}</b></div>
      <div class="card org-stat"><span class="small muted">รายรับสุทธิ</span><b class="num">${OL.fmtBaht(s.net)}</b></div></div>
    <h2 style="font-size:17px">โซนตั๋ว</h2>
    ${e.zones.map((z,i)=>{
      const locked=(z.sold||0)+(z.held||0)>0,left=z.capacity-z.sold-z.held,pct=z.capacity?Math.round((z.sold+z.held)*100/z.capacity):0;
      return `<div class="card" style="display:flex;flex-direction:column;gap:10px">
        <div class="row between"><b style="display:flex;gap:8px;align-items:center"><span style="width:12px;height:12px;border-radius:4px;background:${z.color}"></span>${esc(z.name)}</b>
          <span class="small muted num">ขาย ${z.sold} · Hold ${z.held} · เหลือ ${left}${z.kind==='comp'?'':' · '+OL.fmtBaht(z.price*z.sold)}</span></div>
        <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
        ${ro?'':`${z.kind==='comp'?'':fld(`ez${i}-price`,'ราคา (บาท)',{value:String(z.price/100),attrs:`inputmode="decimal" ${locked?'disabled':''}`,hint:locked?OL.canEditZone(z,{price:z.price+1}).reason:''})}
        ${fld(`ez${i}-cap`,'จำนวนที่ขาย',{value:String(z.capacity),attrs:'inputmode="numeric"'})}
        <span class="hint err" id="ez${i}-err" role="alert"></span>
        <button class="btn plain" data-o="zoneSave" data-i="${i}">บันทึกโซนนี้</button>`}</div>`}).join('')}`;
}
function buyerRows(e){
  const o=S.org,q=(o.bq||'').toLowerCase();
  return evTickets(e.id).map(t=>({t,p:orgPerson(t.holderId),z:e.zones.find(z=>z.id===t.zoneId)||{name:'—'}}))
    .filter(r=>(o.bzone==='all'||!o.bzone||r.t.zoneId===o.bzone)&&(o.bstatus==='all'||!o.bstatus||r.t.status===o.bstatus)
      &&(!q||(r.p.name+' '+r.p.email+' '+r.t.ticketId).toLowerCase().includes(q)));
}
function buyersTable(e){
  const rows=buyerRows(e),em=x=>S.org.showEmails?x:maskEmail(x);
  return `<table id="org-buyers" class="org-table"><thead><tr><th scope="col">ชื่อ</th><th scope="col">อีเมล</th><th scope="col">โซน</th><th scope="col">สถานะ</th><th scope="col">เลขตั๋ว</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><th scope="row">${esc(r.p.name)}</th><td style="text-align:left">${esc(em(r.p.email))}</td><td style="text-align:left">${esc(r.z.name)}</td><td style="text-align:left">${TICKET_STATUS[r.t.status]||r.t.status}</td><td class="mono" style="text-align:left">${esc(r.t.ticketId)}</td></tr>`).join('')}</tbody></table>`
    +(rows.length?'':'<div class="empty">ไม่พบผู้ซื้อที่ตรงกับตัวกรอง</div>');
}
function evBuyers(e){
  const o=S.org;
  return `<div class="field"><label for="bq">ค้นหา (ชื่อ / อีเมล / เลขตั๋ว)</label><input id="bq" type="search" value="${esc(o.bq||'')}" autocomplete="off"></div>
  <div class="row"><div class="field" style="flex:1"><label for="bzone">โซน</label><select id="bzone"><option value="all">ทั้งหมด</option>${e.zones.map(z=>`<option value="${z.id}" ${o.bzone===z.id?'selected':''}>${esc(z.name)}</option>`).join('')}</select></div>
    <div class="field" style="flex:1"><label for="bstatus">สถานะ</label><select id="bstatus"><option value="all">ทั้งหมด</option>${Object.entries(TICKET_STATUS).map(([k,v])=>`<option value="${k}" ${o.bstatus===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
  <div class="row" style="flex-wrap:wrap"><button class="btn plain" style="width:auto;padding:9px 14px;font-size:14px" data-o="csv">ส่งออก CSV</button>
    ${o.role==='owner'?`<button class="btn plain" style="width:auto;padding:9px 14px;font-size:14px" data-o="showEmails" aria-pressed="${!!o.showEmails}">${o.showEmails?'ซ่อนอีเมล':'แสดงอีเมลเต็ม'}</button>`:''}
    <span class="small muted" style="align-self:center">อีเมลถูกปิดบังบางส่วนตามค่าเริ่มต้น</span></div>
  <div style="overflow-x:auto" id="org-buyers-wrap">${buyersTable(e)}</div>`;
}
function evResale(e){
  const B=OL.fmtBaht,tk=evTickets(e.id).filter(t=>t.hops.length>1||t.status==='listed');
  const hasResale=tk.length>0,p=e.params;
  const comm=tk.reduce((a,t)=>a+OL.settleTicket(t,(e.zones.find(z=>z.id===t.zoneId)||{price:0}).price).commission,0);
  return `<div id="org-resale" style="display:flex;flex-direction:column;gap:14px">
  <div class="card small"><b>ร้านได้ราคาหน้าบัตรตามเดิม</b><br><span class="muted">คอมมิชชัน 6% ของราคาขายต่อหักจากผู้ขายและเป็นของแพลตฟอร์ม ผู้จัดไม่เสียเงินเพิ่มและไม่ได้ส่วนแบ่ง</span></div>

// cancel an event: one refund per paid hop, safe to run again (idempotency keys), buyer tickets follow
function orgCancelEvent(id,reason){
  const o=S.org,ev=orgEv(id);
  if(!ev||ev.status==='cancelled'||ev.status==='ended'||ev.status==='draft')return {refunded:0,total:0,refunds:[]};
  const done=new Set(o.ledger.filter(l=>l.type==='REFUND_OUT').map(l=>l.idempotencyKey));
  const plan=OL.planCancellation(ev,o.tickets,done);
  for(const r of plan.refunds)ledgerAdd({type:'REFUND_OUT',eventId:id,ticketId:r.ticketId,amount:r.amount,party:r.payerId,idempotencyKey:r.key});
  for(const t of o.tickets)if(t.eventId===id&&t.hops.some(h=>h.paid>0))t.status='refunded';
  replaceOrgEvent({...ev,status:'cancelled',cancelReason:reason||''});
  S.listings=S.listings.filter(l=>l.ev!==id);
  for(const bt of S.tickets){
    if(bt.ev!==id)continue;
    const mine=plan.refunds.filter(r=>r.ticketId===bt.orgTicketId&&r.payerId==='me').reduce((a,r)=>a+r.amount,0);
    bt.status='refunded';bt.refundAmount=mine/100;
  }
  save();
  return {...plan,refunded:plan.refunds.length};
}

// one door decision: ask checkinResult, write the log, and on success mark the ticket used on both sides
function gateRun(ev,ticket,signerId,ts,method){
  const now=Date.now(),r=OL.checkinResult({ticket,event:ev,signerId,ts,now});
  S.org.checkinLog.unshift({at:now,ticketId:ticket?ticket.ticketId:'—',eventId:ev.id,valid:r.valid,reason:r.reason||null,method,by:gateWho()});
  S.org.checkinLog.length=Math.min(S.org.checkinLog.length,50);
  if(r.valid){
    ticket.status='used';ticket.usedAt=now;ticket.checkinMethod=method;
    S.listings=S.listings.filter(l=>l.orgTicketId!==ticket.ticketId);          // checking in cancels a resale listing (context.md 5.2)
    for(const bt of S.tickets)if(bt.orgTicketId===ticket.ticketId)bt.status='used';
  }
  return r;
}

function simCase(c){
  const e=orgEv(S.org.oev),T=evTickets(e.id),now=Date.now();
  const pick=pred=>T.find(pred),other=S.org.tickets.find(t=>t.eventId!==e.id),cx=S.org.events.find(x=>x.status==='cancelled');
  // plain single-owner ticket for the happy path, so the resold ticket stays available for the old-owner case
  const v=pick(t=>t.status==='valid'&&t.hops.length===1)||pick(t=>t.status==='valid'),dc={
    1:()=>v&&[e,v,v.holderId,now-3000],
    2:()=>{const u=pick(t=>t.status==='used');return u&&[e,u,u.holderId,now-3000]},
    3:()=>v&&[e,v,v.holderId,now-61000],
    4:()=>v&&[e,v,v.holderId,now+16000],
    5:()=>other&&[e,other,other.holderId,now-3000],
    6:()=>{const t=cx&&S.org.tickets.find(x=>x.eventId===cx.id);return t&&[cx,t,t.holderId,now-3000]},
    7:()=>{const t=pick(x=>x.status==='valid'&&x.hops.length>1);return t&&[e,t,t.hops[0].payerId,now-3000]},
    8:()=>{const t=pick(x=>x.status==='listed');return t&&[e,t,t.holderId,now-3000]},
  };
  return dc[c]();
}

// price a buyer pays per ticket for an organizer event, with an applied promo code (baht)
function buyUnit(e){
  const z=e.zones[S.zone];
  if(isLocal(e.id)&&S.promo&&S.promo.ev===e.id){const r=OL.applyPromo(S.promo.code,S.org.promos,z.zoneId,Math.round(z.p*100),Date.now());if(r.ok)return r.price/100}
  return z.p;
}
// total for S.qty tickets: a promo code with fewer uses left than S.qty discounts only that many (finishMint does the same per ticket)
function buyTotal(e){
  const z=e.zones[S.zone],unit=buyUnit(e);
  if(unit===z.p)return unit*S.qty;
  const p=S.org.promos.find(x=>x.code===S.promo.code),n=Math.min(S.qty,Math.max(0,p.maxUses-(p.used||0)));
  return unit*n+z.p*(S.qty-n);
}

   "ใช้ระบบจริง" signs in with the buyer's Google session and talks to /api/org/* (src/organizer.js).
   S.org then holds what the server returned (S.org.live = true) and the demo state waits in S.orgDemo.
   The server checks every role and rule again; the checks here only give quicker messages. */
async function orgApi(method,path,body){
  const init={method,credentials:'same-origin'};
  // the API refuses mutations without a JSON content-type (CSRF guard)
  if(method!=='GET'){init.headers={'Content-Type':'application/json'};init.body=JSON.stringify(body||{})}
  const res=await fetch(path,init);
  let data=null;try{data=await res.json()}catch(_){}
  if(!res.ok){const err=new Error((data&&data.error)||'http_'+res.status);err.status=res.status;err.data=data;throw err}
  return data;
}

function finishMint(){
  let t;
  if(S.buyingListing){
    const L=S.buyingListing;S.listings=S.listings.filter(x=>x.lid!==L.lid);
    t={tid:L.tid,ev:L.ev,zone:L.zone,price:L.face,status:'active',transfers:L.transfers+1,tx:'0x'+rand(4)+'…'+rand(4),orgTicketId:L.orgTicketId};
    const ot=L.orgTicketId&&S.org.tickets.find(x=>x.ticketId===L.orgTicketId);
    if(ot){const paid=L.price*100;ot.hops.push({idx:ot.hops.length,payerId:'me',paid,at:Date.now()});ot.holderId='me';ot.status='valid';
      ledgerAdd({type:'PAYMENT_IN',eventId:ot.eventId,ticketId:ot.ticketId,amount:paid,party:'me',idempotencyKey:'in:'+ot.ticketId+':'+(ot.hops.length-1)})}
    S.tickets.unshift(t);S.buyingListing=null;
  }else{
    const e=evById(S.ev);const z=e.zones[S.zone];
    let sold=null;
    if(isLocal(e.id)){
      const r=OL.recordPrimarySale(orgEv(e.id),z.zoneId,S.qty,'me',S.tickets.filter(x=>x.ev===e.id).length,Date.now());
      if(!r.ok){toast({sold_out:'ที่นั่งโซนนี้ไม่พอแล้ว',over_limit:'ซื้อได้ไม่เกิน 4 ใบต่อบัญชี',not_on_sale:'งานนี้ปิดรับชั่วคราว',invalid_qty:'จำนวนตั๋วไม่ถูกต้อง'}[r.reason]);S.stack=['home','event'];S.tab='home';render();return}
      if(S.promo&&S.promo.ev===e.id)for(const ot of r.tickets){const res=OL.applyPromo(S.promo.code,S.org.promos,ot.zoneId,ot.hops[0].paid,Date.now());
        if(res.ok){ot.hops[0].paid=res.price;const p=S.org.promos.find(x=>x.code===S.promo.code);if(p)p.used=(p.used||0)+1}}
      S.promo=null;
      replaceOrgEvent(r.event);S.org.tickets.push(...r.tickets);sold=r.tickets;
      for(const ot of r.tickets)if(ot.hops[0].paid>0)ledgerAdd({type:'PAYMENT_IN',eventId:e.id,ticketId:ot.ticketId,amount:ot.hops[0].paid,party:'me',idempotencyKey:'in:'+ot.ticketId+':0'});
    }else z.left=Math.max(0,z.left-S.qty);
    for(let k=0;k<S.qty;k++){t={tid:S.nextTid++,ev:e.id,zone:z.z,price:z.p,status:'active',transfers:0,tx:'0x'+rand(4)+'…'+rand(4),orgTicketId:sold?sold[k].ticketId:undefined};S.tickets.unshift(t)}
    t=S.tickets[S.qty-1];
  }
  S.sel=t;S.stack=['tickets'];S.tab='tickets';S.mtab='active';go('success');
}
function rand(n){return Array.from({length:n},()=>'0123456789abcdef'[Math.random()*16|0]).join('')}

/* ---------- pseudo QR ---------- */
function drawQR(c,seed){
  if(!c)return;const N=29,ctx=c.getContext('2d');
  let h=2166136261;for(const ch of seed){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}
  const rnd=()=>{h|=0;h=h+0x6D2B79F5|0;let t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  ctx.fillStyle='#fff';ctx.fillRect(0,0,N,N);ctx.fillStyle='#1E1416';
  const inFinder=(x,y)=>[[0,0],[N-7,0],[0,N-7]].some(([fx,fy])=>x>=fx-1&&x<=fx+7&&y>=fy-1&&y<=fy+7);
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(!inFinder(x,y)&&rnd()<.48)ctx.fillRect(x,y,1,1);
  [[1,1],[N-8,1],[1,N-8]].forEach(([x,y])=>{ctx.fillRect(x,y,7,7);ctx.fillStyle='#fff';ctx.fillRect(x+1,y+1,5,5);ctx.fillStyle='#1E1416';ctx.fillRect(x+2,y+2,3,3)});
  ctx.fillStyle='#A00018';ctx.fillRect(13,13,3,3);
}

/* ---------- sheets ---------- */
const FOCUSABLE='button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';
let sheetOpener=null;
function sheet(html){
  // remember what opened the first sheet so focus can go back there (a sheet opened from inside a sheet keeps the original opener)
  const opener=$('#sheet')&&sheetOpener?sheetOpener:document.activeElement;
  closeSheet(true);sheetOpener=opener&&opener!==document.body?opener:null;
  const w=document.createElement('div');w.className='sheet-wrap';w.id='sheet';
  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grab"></div>${html}</div>`;
  w.addEventListener('click',ev=>{if(ev.target===w)closeSheet()});$('#scroll').appendChild(w);$('#scroll').scrollTop=0;$('#scroll').style.overflow='hidden';
  const first=w.querySelector('.sheet '+FOCUSABLE.split(',').join(',.sheet '));(first||w.querySelector('.sheet')).focus();
}
function closeSheet(keepOpener){
  const s=$('#sheet');if(s)s.remove();$('#scroll').style.overflow='';
  if(!keepOpener){if(sheetOpener&&sheetOpener.isConnected)sheetOpener.focus();sheetOpener=null}
}
// keep Tab inside an open sheet
document.addEventListener('keydown',e=>{
  if(e.key!=='Tab')return;const s=$('#sheet');if(!s)return;
  const f=[...s.querySelectorAll(FOCUSABLE)];if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(!s.contains(document.activeElement)){e.preventDefault();first.focus()}
  else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});

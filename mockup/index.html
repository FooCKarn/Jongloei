/* ---------- real Google sign-in (src/worker.js) ----------
   /api/me says whether the Worker has Google secrets. Without them (or when the
   page is opened as a file) the demo login above stays as it is. */
const AUTH_KEY='jongloei-auth-after';
async function startStripeCheckout(){
  if(!/^https?:$/.test(location.protocol)){
    toast('กรุณาเปิดเว็บผ่าน URL ของ Cloudflare Worker ไม่ใช่ไฟล์ในเครื่อง');
    return;
  }
  if(!S.auth.google){
    toast('กรุณาเข้าสู่ระบบ Google ก่อนชำระเงิน');
    openSignup('checkout');
    return;
  }
  const listing=S.buyingListing;
  const eventId=listing?listing.ev:S.ev;
  const zone=listing?listing.zone:evById(S.ev).zones[S.zone].z;
  const quantity=listing?1:S.qty;
  const button=document.querySelector('[data-act="topay"],[data-act="paid"]');
  if(button){button.disabled=true;button.textContent='กำลังเชื่อมต่อ Stripe…'}
  try{
    const endpoint=listing&&listing.real?'/api/resale/checkout':'/api/checkout-session';
    const response=await fetch(endpoint,{
      method:'POST',
      credentials:'same-origin',
      headers:{'content-type':'application/json'},
      body:JSON.stringify(listing&&listing.real?{listingId:listing.lid}:{eventId,zone,quantity}),
    });
    const data=await readJsonResponse(response,endpoint);
    if(!data){
      throw new Error(response.status===404
        ?'ไม่พบ API ของ Worker กรุณา deploy Worker เวอร์ชันล่าสุด'
        :'Worker ส่งข้อมูลไม่ใช่ JSON กรุณาตรวจสอบการ deploy');
    }
    if(!response.ok||!data.url){
      const messages={
        authentication_required:'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่',
        sold_out:'ที่นั่งโซนนี้หมดแล้ว หรือมีคนกำลังชำระอยู่ ลองโซนอื่นหรือรอสักครู่',
        ticket_limit:'ซื้อได้สูงสุด 4 ใบต่อบัญชีต่องาน (รวมรายการที่กำลังชำระ)',
        listing_held:'มีคนกำลังชำระตั๋วใบนี้อยู่ ลองใหม่ใน 10 นาที',
        listing_unavailable:'ตั๋วใบนี้ถูกขายหรือยกเลิกไปแล้ว',
        own_listing:'ซื้อตั๋วที่ตัวเองลงขายไม่ได้',
        transfer_closed:'ปิดการซื้อขายต่อแล้ว (1 ชั่วโมงก่อนงานเริ่ม)',
        no_wallet:'ยังไม่มีกระเป๋าตั๋ว ลองออกจากระบบแล้วเข้าใหม่',
        invalid_ticket:'ข้อมูลตั๋วไม่ถูกต้อง กรุณาเลือกใหม่',
        stripe_unconfigured:'ระบบยังไม่ได้ตั้งค่า Stripe Secret Key',
        stripe_request_failed:'Stripe ปฏิเสธคำขอ กรุณาตรวจสอบ API key และบัญชี Stripe',
        payment_storage_unavailable:'ระบบฐานข้อมูลยังไม่พร้อม กรุณา apply migration 0002_payments.sql บน D1',
        event_storage_unavailable:'ระบบรายการอีเวนต์ยังไม่พร้อม กรุณา apply migration 0003_events.sql บน D1',
      };
      throw new Error(messages[data.error]||data.error||'checkout_failed');
    }
    location.href=data.url;
  }catch(err){
    console.error('Stripe checkout failed',err);
    if(button){button.disabled=false;button.textContent='ลองใหม่อีกครั้ง'}
    toast(err.message||'เชื่อมต่อ Stripe ไม่สำเร็จ กรุณาลองใหม่');
  }
}
async function readJsonResponse(response,endpoint){
  const contentType=response.headers.get('content-type')||'';
  if(!contentType.includes('application/json')){
    throw new Error(response.status===404
      ?`ไม่พบ ${endpoint} กรุณา deploy Worker เวอร์ชันล่าสุด`
      :`${endpoint} ส่งข้อมูลไม่ใช่ JSON (HTTP ${response.status}) กรุณาตรวจสอบว่าเปิดจาก Worker URL`);
  }
  try{return await response.json()}catch(_){throw new Error(`${endpoint} ส่ง JSON ไม่ถูกต้อง กรุณาตรวจสอบ Worker`)}
}
function googleLogin(){
  try{sessionStorage.setItem(AUTH_KEY,JSON.stringify({after:S.afterSignup,ev:S.ev,zone:S.zone,qty:S.qty,lid:S.buyingListing&&S.buyingListing.lid}))}catch(_){}
  location.href='/auth/google/start';
}
async function checkAuth(){
  if(!/^https?:$/.test(location.protocol))return;
  let me;try{const r=await fetch('/api/me',{credentials:'same-origin'});if(!r.ok)return;me=await readJsonResponse(r,'/api/me')}catch(err){console.error('Auth API failed',err);return}
  if(!me||!me.googleEnabled)return;
  S.auth.google=true;
  S.signedIn=!!me.user;
  if(me.user)Object.assign(S.user,{name:me.user.name||me.user.email,email:me.user.email||''},me.user.wallet?{wallet:me.user.wallet}:{});
  const q=new URLSearchParams(location.search),result=q.get('login');
  if(result){q.delete('login');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash)}
  let back=null;try{back=JSON.parse(sessionStorage.getItem(AUTH_KEY)||'null');sessionStorage.removeItem(AUTH_KEY)}catch(_){}
  if(back&&me.user){if(back.ev&&evById(back.ev)){S.ev=back.ev;S.zone=back.zone||0;S.qty=back.qty||1}
    S.buyingListing=back.lid?marketListings().find(l=>l.lid==back.lid)||null:null;S.afterSignup=back.after||null}
  render();
  if(S.orgLiveWanted&&me.user&&S.mode==='org'&&!(S.org&&S.org.live))orgLiveStart();
  loadMyTickets();
  handleCheckoutReturn();
  if(result==='new'&&me.user)walletCreating();
  else if(result==='ok'&&me.user){toast('เข้าสู่ระบบแล้ว');if(S.afterSignup){const n=S.afterSignup;S.afterSignup=null;resumeAfter(n)}}
  else if(result==='error')toast('เข้าสู่ระบบไม่สำเร็จ ลองอีกครั้ง');
}

/* tickets minted by the Worker after a verified payment (GET /api/tickets) */
function realTicket(t){
  return {key:t.id,tid:t.tokenId??'…',ev:t.eventId,zone:t.zone,price:t.price,
    status:t.status==='minting'||t.status==='mint_failed'?'active':t.status,
    minting:t.status==='minting',failed:t.status==='mint_failed',transfers:t.transfers,
    tx:t.txHash?short(t.txHash):'กำลังส่งธุรกรรม',explorer:t.explorer,real:true};
}
async function loadMyTickets(){
  if(!S.auth.google||!S.signedIn)return;
  try{
    const response=await fetch('/api/tickets',{credentials:'same-origin'});
    const data=await readJsonResponse(response,'/api/tickets');
    if(!response.ok||!Array.isArray(data.tickets))return;
    S.tickets=data.tickets.map(realTicket);
    await loadResale();
    if(S.tickets.some(t=>t.minting))setTimeout(loadMyTickets,5000);
  }catch(err){console.error('Ticket API failed',err)}
}

/* resale on the Worker (src/resale.js); demo listings stay in S.listings for file:// and demo login */
function marketListings(){return S.auth.google?(S.realListings||[]):S.listings}
async function loadResale(){
  try{
    const [market,mine]=await Promise.all(['/api/resale/listings','/api/resale/listings?mine=1'].map(u=>fetch(u,{credentials:'same-origin'}).then(r=>r.ok?r.json():{listings:[]})));
    S.realListings=market.listings.map(l=>({lid:l.id,ev:l.eventId,zone:l.zone,face:l.facePrice,price:l.price,seller:l.seller,transfers:l.transfers,tid:l.tokenId,held:l.held,mine:l.mine,real:true}));
    for(const l of mine.listings){const t=S.tickets.find(x=>x.key===l.ticketId);if(t){t.listPrice=l.price;t.listingId=l.id;t.listingSold=l.status==='sold'}}
  }catch(err){console.error('Resale API failed',err)}
  render();
}
const RESALE_ERRORS={holding_period:'ลงขายได้หลังได้ตั๋วครบ 6 ชั่วโมง',transfer_closed:'ปิดการขายต่อแล้ว (1 ชั่วโมงก่อนงานเริ่ม)',invalid_price:'ราคาเกินเพดาน 125% ของราคาหน้าบัตร',
  already_listed:'ตั๋วใบนี้ลงขายอยู่แล้ว',ticket_not_listable:'ตั๋วใบนี้ลงขายไม่ได้',event_not_open:'งานนี้ปิดหรือถูกยกเลิกแล้ว',event_time_unknown:'งานนี้ยังไม่มีเวลาเริ่มที่ชัดเจน',
  listing_on_hold:'มีคนกำลังชำระตั๋วใบนี้ ยกเลิกได้หลังหมดเวลา 10 นาที',listing_closed:'รายการนี้ปิดไปแล้ว'};
async function resaleCall(method,path,body){
  const r=await fetch(path,{method,credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){let m=RESALE_ERRORS[d.error]||'ทำรายการไม่สำเร็จ ลองใหม่อีกครั้ง';if(d.error==='holding_period'&&d.listableAt)m+=' (ลงขายได้ '+new Date(d.listableAt).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})+')';throw new Error(m)}
  return d;
}
async function resaleList(tk,price){
  try{await resaleCall('POST','/api/resale/listings',{ticketId:tk.key,price});closeSheet();toast('ลงขายแล้ว ดูได้ในตลาดรีเซล');await loadMyTickets();S.sel=S.tickets.find(x=>x.key===tk.key)||S.sel;render()}
  catch(err){toast(err.message)}
}
async function resaleUnlist(tk){
  if(!tk.listingId){toast(tk.listingSold?'ตั๋วขายแล้ว กำลังโอนให้ผู้ซื้อ':'ไม่พบรายการขาย');return}
  try{await resaleCall('DELETE','/api/resale/listings/'+encodeURIComponent(tk.listingId));toast('ยกเลิกการลงขายแล้ว');await loadMyTickets();S.sel=S.tickets.find(x=>x.key===tk.key)||S.sel;render()}
  catch(err){toast(err.message)}
}
async function handleCheckoutReturn(){
  const q=new URLSearchParams(location.search);
  const sessionId=q.get('session_id'),cancelled=q.get('checkout')==='cancelled',orderId=q.get('order');
  if(!q.get('checkout'))return;
  q.delete('checkout');q.delete('session_id');q.delete('order');
  history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);
  if(cancelled){
    if(orderId&&S.signedIn)fetch('/api/checkout-cancel',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({orderId})})
      .then(()=>loadEvents()).then(render).catch(err=>console.error('Cancel failed',err));
    toast('ยกเลิกการชำระเงินแล้ว คืนที่นั่งให้ระบบ');return;
  }
  if(!sessionId||!S.signedIn)return;
  S.order={status:'pending'};S.stack=['paymentSuccess'];S.tab='tickets';render();
  for(let attempt=0;attempt<40;attempt++){
    try{
      const response=await fetch('/api/checkout-status?session_id='+encodeURIComponent(sessionId),{credentials:'same-origin'});
      const data=await readJsonResponse(response,'/api/checkout-status');
      if(!response.ok)throw new Error(data.error||'status_failed');
      const changed=data.status!==S.order.status;S.order=data;
      if(data.status==='fulfilled'){
        await loadMyTickets();
        const first=S.tickets.find(t=>t.key===(data.tickets[0]&&data.tickets[0].id));
        if(first){S.sel=first;S.stack=['tickets'];S.mtab='active';go('success')}else if(changed)render();
        return;
      }
      if(changed&&S.stack[S.stack.length-1]==='paymentSuccess')render();
      if(['needs_review','expired','failed'].includes(data.status))return;
    }catch(err){console.error('Checkout status failed',err);return}
    await new Promise(resolve=>setTimeout(resolve,3000));
  }
  toast('ตั๋วยังออกไม่เสร็จ ระบบจะออกให้อัตโนมัติ ดูได้ที่ตั๋วของฉัน');
}

/* boot: signed-out home, matching step 1 of the flow */
load();ensureOrg();if(S.mode==='org'){S.tab='orgDash';S.stack=['orgDash']}
applyMode();render();(async()=>{await loadEvents();render();checkAuth()})();
})();
</script>
